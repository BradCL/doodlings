    sizeBtns.forEach((b, i) => b.classList.toggle('on', i === st.size && !st.erase));
    eraserBtn.classList.toggle('on', st.erase);
    catBtns.forEach((b, i) => b.classList.toggle('on', CATS[i][0] === st.cat));
    catBtns[5].style.display = Grow.of(d).looks.length ? '' : 'none';
    nextBtn.classList.toggle('dim', !d.outline);
    setIcon(nextBtn, st.step < 2 ? 'next' : d.awake ? 'check' : 'spark');
    nextBtn.classList.toggle('glow', st.step === 2 && !d.awake);
    if (st.step === 2 && (thumbCat !== st.cat || thumbBody !== d.color || thumbFor !== d)) buildThumbs();
  }

  function buildThumbs() {
    thumbCat = st.cat; thumbBody = d.color; thumbFor = d;
    thumbs.innerHTML = ''; thumbs.scrollLeft = 0;
    if (st.cat === 'look') {                                // as it was drawn, and every look it has grown: tap to wear
      const G = Grow.of(d);
      for (const lk of [0, ...G.looks]) {
        const b = el('button', 'thumb lookthumb' + (G.look === lk ? ' on' : ''), thumbs); b.type = 'button'; b.setAttribute('aria-label', lk ? 'look-' + LOOKS[lk].k : 'look-drawn');
        Moment.portrait(b, c, lk, 54);
        b.addEventListener('click', () => {
          Sound.unlock(); G.look = lk; c.refreshParts(); c.qv += 3; Sound.sfx(lk ? 'sparkle' : 'tap');
          thumbs.querySelectorAll('.lookthumb').forEach((x) => x.classList.toggle('on', x === b));
          App.keepSoon(c);
        });
      }
      return;
    }
    if (st.cat === 'voice') {                               // tap one to hear it say hello
      for (const key of VOICE_LIST) {
        const b = el('button', 'thumb voice' + (d.voice === key ? ' on' : ''), thumbs); b.type = 'button'; b.setAttribute('aria-label', 'voice-' + key);
        const [, g] = miniCanvas(54, b);
        drawVoiceThumb(g, key, 54);
        b.addEventListener('click', () => {
          Sound.unlock(); d.voice = key;
          Sound.setVoice({ size: 0.5, seed: d.seed, style: key }); Sound.voice('hello'); c.say(0.7); c.qv -= 2.5;
          thumbs.querySelectorAll('.voice').forEach((x) => x.classList.toggle('on', x === b));
          if (d.outline) App.keepSoon(c);
        });
      }
      return;
    }
    // prizes this doodling has won at the fair come first in its tray
    const won = Grow.of(d).own.filter((k) => PARTS[k] && (PARTS[k].layer === 'back') === (st.cat === 'bits') && (st.cat === 'bits' || st.cat === 'wear'));
    for (const key of won.concat(PART_TRAYS[st.cat])) {
      const b = el('button', 'thumb' + (won.includes(key) ? ' won' : ''), thumbs); b.type = 'button'; b.setAttribute('aria-label', key);
      const [, g] = miniCanvas(54, b);
      drawPartThumb(g, key, 54, d.color);
      // tap = add at a sensible spot; drag upward = carry it onto the creature
      let start = null, spawned = false;
      b.addEventListener('pointerdown', (e) => { Sound.unlock(); start = { x: e.clientX, y: e.clientY }; spawned = false; });
      b.addEventListener('pointermove', (e) => {
        if (!start) return;
        if (!spawned && start.y - e.clientY > 16 && Math.abs(e.clientX - start.x) < 40) {
          const i = addPart(key, e.clientX, e.clientY);
          if (i < 0) { start = null; return; }
          spawned = true;
          try { b.setPointerCapture(e.pointerId); } catch (_) {}
          st.drag = { type: 'part', i, ox: 0, oy: 0, fromTray: true };
        }
        if (spawned) move({ x: e.clientX, y: e.clientY });
      });
      const end = (e) => { if (spawned) up({ x: e.clientX, y: e.clientY }); start = null; };
      b.addEventListener('pointerup', end);
      b.addEventListener('pointercancel', () => { if (spawned && st.drag) { st.drag = null; } start = null; });
      b.addEventListener('click', () => { if (!spawned) addPart(key); spawned = false; });
    }
  }

  function pickColor(col) {
    st.color = col; st.erase = false;
    if (st.step === 0) { d.color = col; c.colorCache.clear(); }
    if (st.step === 2 && st.sel >= 0 && d.parts[st.sel]) { d.parts[st.sel].c = col; if (c.m) { c.qv += 1.5; } }
    Sound.sfx('tap', { pitch: PALETTE.indexOf(col) - 5 });
    if (d.outline) App.keepSoon(c);
    syncTools();
  }

  const snapshot = () => ({ outline: d.outline, paint: d.paint.slice(), parts: d.parts.map((p) => ({ ...p })), color: d.color });
  function restore(s) {
    d.paint = s.paint; d.parts = s.parts; d.color = s.color;
    if (s.outline) c.setOutline(s.outline); else { d.outline = null; c.m = null; }
    c.paintDirty = true; c.colorCache.clear(); c.refreshParts(); st.sel = -1;
  }
  function undo() {
    if (st.step === 1) {
      if (!d.paint.length) { Sound.sfx('error'); return; }
      d.paint.pop(); c.paintDirty = true;
    } else {
      if (!st.undo.length) { Sound.sfx('error'); return; }
      restore(st.undo.pop());
    }
    Sound.sfx('undo'); syncTools();
    if (d.outline) App.keepSoon(c); else App.remove(d.id);
  }
  function dice() {
    st.undo.push(snapshot());
    if (!d.outline) { d.color = pick(PALETTE.slice(0, 9)); st.color = d.color; c.colorCache.clear(); }
    c.setOutline(Shape.random());
    App.keep(c);
    Sound.sfx('dice'); plop(); syncTools();
  }
  function clearAll() {
    if (!d.outline) { Sound.sfx('error'); return; }
    st.undo.push(snapshot());
    d.outline = null; c.m = null; d.paint = []; d.parts = []; c.refreshParts(); c.paintDirty = true;
    App.pending = null; App.remove(d.id);                 // an erased doodling leaves the shelf (undo brings it back)
    Sound.sfx('delete'); syncTools();
  }
  function plop() {
    c.qv += 4.5;
    for (let i = 0; i < c.n; i++) { c.ovx[i] += c.rx[i] * sq.s * 0.9; c.ovy[i] += c.ry[i] * sq.s * 0.9; }
  }

  // ----- parts -----
  const slotFor = (def, key) => partSlot(c, key);
  function addPart(key, px, py) {
    const def = PARTS[key];
    if (!def || !c.m) return -1;
    if (d.parts.length >= MAX_PARTS) { wiggle(thumbs); Sound.sfx('error'); return -1; }
    const s = slotFor(def, key);
    const p = { k: key, x: s.x, y: s.y, s: 1, r: s.r, c: null };
    if (px !== undefined) { p.x = (px - sq.x) / sq.s; p.y = (py - sq.y) / sq.s; }
    d.parts.push(p);
    c.refreshParts();
    st.sel = d.parts.length - 1;
    if (px === undefined) { Sound.sfx('stick'); c.qv += 2; }
    else Sound.sfx('pick');
    App.keepSoon(c);
    return st.sel;
  }
  function partGeom(i) {
    const p = d.parts[i], def = PARTS[p.k];
    const [ax, ay] = c.toWorld(p._u, p._v), px = c.S * def.size * (p.s || 1);
    const tall = def.layer === 'back' || TALL_PARTS.includes(p.k);
    const off = def.box ? -def.box[1] * px : tall ? 0.45 * px : 0, r = p.r || 0;
    return { ax, ay, cx: ax + Math.sin(r) * off, cy: ay - Math.cos(r) * off, px, R: Math.max(30, px * 0.62) + 8 };
  }
  function removePart(i) {
    d.parts.splice(i, 1); c.swing.splice(i, 1); c.refreshParts(); st.sel = -1;
    Sound.sfx('delete'); App.keepSoon(c);
  }
  function orientFollow(p, ux0, uy0) {
    const def = PARTS[p.k];
    if (!def.orient) return;
    const [ux, uy] = c.toUnit(p.x, p.y);
    if (hypot(ux, uy) < 0.12 || hypot(ux0, uy0) < 0.12) return;
    p.r = wrapAngle(p.r + wrapAngle(Math.atan2(ux, -uy) - Math.atan2(ux0, -uy0)));
  }

  // ----- pointer -----
  const toSq = (p) => [clamp((p.x - sq.x) / sq.s, 0, 1), clamp((p.y - sq.y) / sq.s, 0, 1)];
  const onStage = (p) => p.x > sq.x - 20 && p.x < sq.x + sq.s + 20 && p.y > sq.y - 20 && p.y < sq.y + sq.s + 20;

  function down(p) {
    st.idle = 0;
    if (!onStage(p)) return;
    const [x, y] = toSq(p);
    if (st.step === 0) { st.stroke = [x, y]; Sound.sfx('brush'); return; }
    if (!c.m) return;
    if (st.step === 1) {
      if (d.paint.length > 500) d.paint.shift(), (c.paintDirty = true);
      st.paint = { c: st.erase ? 'erase' : st.color, w: BRUSH[st.size] * (st.erase ? 1.5 : 1), p: [x, y] };
      d.paint.push(st.paint);
      c.ensurePaint(); c.paintStroke(st.paint, 0);
      Sound.sfx('brush');
      return;
    }
    // parts: handles of the selected part first
    if (st.sel >= 0 && d.parts[st.sel]) {
      const gm = partGeom(st.sel), k = Math.SQRT1_2;
      if (hypot(p.x - (gm.cx + gm.R * k), p.y - (gm.cy - gm.R * k)) < 26) {
        const part = d.parts[st.sel];
        st.drag = { type: 'handle', i: st.sel, s0: part.s || 1, r0: part.r || 0, d0: hypot(p.x - gm.ax, p.y - gm.ay) || 1, a0: Math.atan2(p.y - gm.ay, p.x - gm.ax) };
        return;
      }
      if (hypot(p.x - (gm.cx - gm.R * k), p.y - (gm.cy - gm.R * k)) < 24) { removePart(st.sel); return; }
    }
    let hit = -1, best = 1e9;
    for (let i = d.parts.length - 1; i >= 0; i--) {
      if (!PARTS[d.parts[i].k]) continue;
      const gm = partGeom(i), dist = hypot(p.x - gm.cx, p.y - gm.cy);
      if (dist < Math.max(24, gm.px * 0.55) && dist < best) { best = dist; hit = i; if (PARTS[d.parts[i].k].layer !== 'back') break; }
    }
    st.sel = hit;
    if (hit >= 0) {
      const gm = partGeom(hit);
      st.drag = { type: 'part', i: hit, ox: p.x - gm.ax, oy: p.y - gm.ay };
      Sound.sfx('pick');
    }
  }

  function move(p) {
    st.idle = 0;
    if (c && c.alive) c.lookAt = { x: p.x, y: p.y };
    if (st.stroke) {
      const [x, y] = toSq(p), s = st.stroke, n = s.length;
      if (hypot(x - s[n - 2], y - s[n - 1]) > 0.006 && n < 1600) s.push(x, y);
      return;
    }
    if (st.paint) {
      const [x, y] = toSq(p), s = st.paint.p, n = s.length;
      if (hypot(x - s[n - 2], y - s[n - 1]) > 0.004 && n < 1400) {
        s.push(x, y); c.paintStroke(st.paint, s.length - 2);
        if (App.now - st.brushT > 0.11) { st.brushT = App.now; Sound.sfx('brush', { pitch: rand(-3, 3) }); }
      }
      return;
    }
    const dr = st.drag;
    if (!dr || !d.parts[dr.i]) return;
    const part = d.parts[dr.i];
    if (dr.type === 'part') {
      const [ux0, uy0] = c.toUnit(part.x, part.y);
      part.x = clamp((p.x - dr.ox - sq.x) / sq.s, -0.1, 1.1); part.y = clamp((p.y - dr.oy - sq.y) / sq.s, -0.1, 1.1);
      orientFollow(part, ux0, uy0);
    } else {
      const gm = partGeom(dr.i);
      part.s = clamp((dr.s0 * hypot(p.x - gm.ax, p.y - gm.ay)) / dr.d0, 0.4, 3.2);
      part.r = wrapAngle(dr.r0 + Math.atan2(p.y - gm.ay, p.x - gm.ax) - dr.a0);
    }
    c.refreshParts();
  }

  function up(p) {
    if (c && d.outline) App.keepSoon(c);
    if (st.stroke) {
      const s = st.stroke; st.stroke = null;
      let o = Shape.merge(d.outline, s, SHAPE_BRUSH);
      if (!o) { Sound.sfx('error'); return; }
      const m = Shape.metrics(o);
      if (m.r < 0.11) o = Shape.scaled(o, 0.11 / m.r);
      st.undo.push(snapshot()); if (st.undo.length > 30) st.undo.shift();
      const first = !d.outline;
      c.setOutline(o);
      Sound.sfx('clay'); plop(); App.keepSoon(c);
      if (first) App.fx.burst('star', sq.x + c.m.cx * sq.s, sq.y + c.m.cy * sq.s, 10, { speed: sq.s * 0.9, size: 12, life: 0.7, colors: [d.color, '#FFC928', '#fff'], drag: 3 });
      syncTools();
      return;
    }
    if (st.paint) {
      st.paint = null;
      if (c.alive && Math.random() < 0.4) { c.setMood('happy', 0.9); Sound.voice('giggle'); c.say(0.5); }
      return;
    }
    const dr = st.drag;
    st.drag = null;
    if (dr && dr.type === 'part' && d.parts[dr.i]) {
      const overTray = p && p.y > tray.getBoundingClientRect().top + 6;
      const part = d.parts[dr.i];
      if (overTray || part.x < -0.08 || part.x > 1.08 || part.y < -0.08 || part.y > 1.08) { removePart(dr.i); return; }
      Sound.sfx('stick'); c.qv += 1.6;
    }
  }

  function next() {
    if (!d.outline) { wiggle(nextBtn); Sound.sfx('error'); return; }
    if (st.step < 2) { setStep(st.step + 1); return; }
    App.keep(c);
    App.go('world', { critter: c, from: 'studio' });
  }
  function goHome() {
    Sound.sfx('page');
    if (d.outline) App.keep(c);
    App.go('home');
  }

  // ----- frame -----
  function step(dt) {
    st.t += dt; st.idle += dt;
    if (c && c.m) {
      c.x = sq.x + c.m.cx * sq.s; c.y = sq.y + c.m.cy * sq.s; c.baseS = c.m.r * sq.s;
      c.step(dt, null);
    }
  }

  function draw(g) {
    App.paper(g);
    // the mat you draw on
    g.save();
    g.shadowColor = 'rgba(150,110,50,0.18)'; g.shadowBlur = 36; g.shadowOffsetY = 12;
    g.fillStyle = '#FFFDF8';
    g.beginPath(); g.roundRect(sq.x, sq.y, sq.s, sq.s, sq.s * 0.09); g.fill();
    g.restore();
    g.save();
    g.beginPath(); g.roundRect(sq.x, sq.y, sq.s, sq.s, sq.s * 0.09); g.clip();
    g.fillStyle = 'rgba(214,190,150,0.2)';
    const gap = sq.s / 14;
    for (let i = 1; i < 14; i++) for (let j = 1; j < 14; j++) { g.beginPath(); g.arc(sq.x + i * gap, sq.y + j * gap, 1.6, 0, TAU); g.fill(); }
    g.restore();

    if (c.m) c.draw(g);

    if (st.stroke) {
      const s = st.stroke, w = SHAPE_BRUSH * sq.s;
      g.save(); g.lineCap = g.lineJoin = 'round';
      const path = () => { g.beginPath(); g.moveTo(sq.x + s[0] * sq.s, sq.y + s[1] * sq.s); for (let i = 2; i < s.length; i += 2) g.lineTo(sq.x + s[i] * sq.s, sq.y + s[i + 1] * sq.s); if (s.length === 2) g.lineTo(sq.x + s[0] * sq.s + 0.1, sq.y + s[1] * sq.s); };
      path(); g.strokeStyle = inkOf(d.color); g.lineWidth = w + 8; g.stroke();
      path(); g.strokeStyle = d.color; g.lineWidth = w; g.stroke();
      if (Shape.isLoop(s)) { g.globalAlpha = 0.35; g.fillStyle = d.color; g.fill(); }
      g.restore();
    }

    if (st.step === 2 && st.sel >= 0 && d.parts[st.sel] && c.m) {
      const gm = partGeom(st.sel), k = Math.SQRT1_2;
      g.save();
      g.strokeStyle = 'rgba(43,45,66,0.55)'; g.lineWidth = 2.5; g.setLineDash([7, 8]); g.lineDashOffset = -st.t * 14;
      g.beginPath(); g.arc(gm.cx, gm.cy, gm.R, 0, TAU); g.stroke();
      g.setLineDash([]);
      knob(g, gm.cx + gm.R * k, gm.cy - gm.R * k, '#fff', INK, 'grow');
      knob(g, gm.cx - gm.R * k, gm.cy - gm.R * k, '#FF5A4E', '#fff', 'x');
      g.restore();
    }

    // show how: a finger drawing a loop
    if (st.step === 0 && !d.outline && !st.stroke && st.idle > 0.9) {
      const T = 3.6, u = ((st.idle - 0.9) % T) / T, n = hintPath.length / 2;
      const upto = Math.min(1, u / 0.72), a = u > 0.86 ? 1 - (u - 0.86) / 0.14 : Math.min(1, u * 8);
      const P = (f) => { const i = Math.floor(f * n) % n; return [sq.x + (0.5 + (hintPath[i * 2] - 0.5) * 1.15) * sq.s, sq.y + (0.5 + (hintPath[i * 2 + 1] - 0.52) * 1.15) * sq.s]; };
      g.save(); g.globalAlpha = a * 0.55;
      g.strokeStyle = d.color; g.lineWidth = Math.max(8, sq.s * 0.03); g.lineCap = g.lineJoin = 'round';
      g.beginPath();
      for (let f = 0; f <= upto; f += 1 / n) { const [x, y] = P(f + 0.62); if (f) g.lineTo(x, y); else g.moveTo(x, y); }
      g.stroke(); g.restore();
      const [hx, hy] = P(upto + 0.62);
      drawTouchDot(g, hx, hy, 0, a);
    }
    App.fx.draw(g, true); App.fx.draw(g, false);
  }

  function knob(g, x, y, bg, fg, kind) {
    g.fillStyle = 'rgba(43,45,66,0.18)'; g.beginPath(); g.arc(x, y + 2.5, 15, 0, TAU); g.fill();
    g.fillStyle = bg; g.beginPath(); g.arc(x, y, 15, 0, TAU); g.fill();
    g.strokeStyle = fg; g.lineWidth = 2.6; g.lineCap = 'round';
    g.beginPath();
    if (kind === 'x') { g.moveTo(x - 5, y - 5); g.lineTo(x + 5, y + 5); g.moveTo(x + 5, y - 5); g.lineTo(x - 5, y + 5); }
    else { g.moveTo(x - 5, y + 5); g.lineTo(x + 5, y - 5); g.moveTo(x + 0.5, y - 5.5); g.lineTo(x + 5.5, y - 5.5); g.lineTo(x + 5.5, y - 0.5); g.moveTo(x - 0.5, y + 5.5); g.lineTo(x - 5.5, y + 5.5); g.lineTo(x - 5.5, y + 0.5); }
    g.stroke();
  }

  return { enter, exit, step, draw, down, move, up, resize: () => root && layout(), _peek: () => ({ sq: { ...sq }, step: st.step, sel: st.sel, parts: c && c.m ? d.parts.map((p, i) => ({ k: p.k, ...partGeom(i) })) : [] }) };
})();

// ===== places.js =====
// ---------- Places: where a doodling can go. Each one is a painting, a little life of its own, and its own feel underfoot ----------
// g: gravity, lift: how high a hop goes, slip: how slippery the ground is (1 = normal), air: how thick the air is, toy: what is lying around to play with
const PLACE_LIST = ['meadow', 'snow', 'rink', 'beach', 'night', 'space', 'sea', 'stage'];

const Places = (() => {
  const sky = (g, W, H, stops) => { const gr = g.createLinearGradient(0, 0, 0, H); stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c)); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
  const hill = (g, W, H, base, amp, col, f1, f2, ph) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, base - amp * (0.6 * Math.sin((x / W) * f1 + ph) + 0.4 * Math.sin((x / W) * f2 + ph * 2.3)));
    g.lineTo(W, H); g.closePath(); g.fill();
  };
  // the ground everyone stands on: a soft rise with a light rim
  const ground = (g, W, H, top, S, hi, lo, rim) => {
    const gr = g.createLinearGradient(0, top, 0, H); gr.addColorStop(0, hi); gr.addColorStop(1, lo);
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, top + 6); g.quadraticCurveTo(W * 0.5, top - S * 0.16, W, top + 6); g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();
    if (rim) { g.strokeStyle = rim; g.lineWidth = 3; g.beginPath(); g.moveTo(0, top + 6); g.quadraticCurveTo(W * 0.5, top - S * 0.16, W, top + 6); g.stroke(); }
  };
  const glow = (g, x, y, r, col, a) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rgba(col, a)); gr.addColorStop(1, rgba(col, 0)); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); };
  const blobs = (g, list, col) => { g.fillStyle = col; for (const [x, y, rx, ry] of list) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fill(); } };
  function pine(g, x, y, h, col, snow) {
    g.fillStyle = col;
    for (let i = 0; i < 3; i++) {
      const w = h * (0.42 - i * 0.09), yy = y - h * (0.18 + i * 0.25);
      g.beginPath(); g.moveTo(x - w, yy); g.quadraticCurveTo(x, yy + h * 0.06, x + w, yy); g.lineTo(x, yy - h * 0.4); g.closePath(); g.fill();
    }
    g.fillRect(x - h * 0.04, y - h * 0.2, h * 0.08, h * 0.2);
    if (snow) { g.fillStyle = snow; for (let i = 0; i < 3; i++) { const w = h * (0.2 - i * 0.04), yy = y - h * (0.4 + i * 0.25); g.beginPath(); g.moveTo(x - w, yy + h * 0.1); g.lineTo(x, yy - h * 0.17); g.lineTo(x + w, yy + h * 0.1); g.quadraticCurveTo(x, yy + h * 0.02, x - w, yy + h * 0.1); g.fill(); } }
  }
  function star5(g, x, y, r, col) {
    g.fillStyle = col; g.beginPath();

    } else if (k === 'beach') {

      L.back = (g) => {
        // the tide breathing in and out

        g.fillStyle = 'rgba(169,237,230,0.75)'; g.beginPath(); g.moveTo(0, top - S * 0.3);
        for (let x = 0; x <= W + 12; x += 12) g.lineTo(x, y + Math.sin(x / S * 1.6 + L.t * 1.5) * S * 0.05);
        g.lineTo(W, top - S * 0.3); g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.95)'; g.lineWidth = 4; g.beginPath();
        for (let x = 0; x <= W + 12; x += 12) g.lineTo(x, y + Math.sin(x / S * 1.6 + L.t * 1.5) * S * 0.05);
        g.stroke();
        const c = L.crab, cy = H - Math.max(14, (H - floor) * 0.2), cs = S * 0.16, wob = c.wait < 0 ? Math.sin(L.t * 18) * 3 : 0;
        g.save(); g.translate(c.x, cy); g.strokeStyle = '#D8432F'; g.lineWidth = 3; g.lineCap = 'round';
        for (const s of [-1, 1]) { for (const j of [0.5, 1]) { g.beginPath(); g.moveTo(s * cs * 0.7, 0); g.lineTo(s * cs * (1.2 + j * 0.3), cs * j * 0.7 + wob * s * (j - 0.75)); g.stroke(); } g.beginPath(); g.moveTo(s * cs * 0.6, -cs * 0.4); g.lineTo(s * cs * 1.2, -cs * 1.1); g.stroke(); g.fillStyle = '#FF5A4E'; g.beginPath(); g.arc(s * cs * 1.25, -cs * 1.2, cs * 0.34, 0, TAU); g.fill(); }

    } else if (k === 'night') {

      L.shoot = { t: 3 };
      L.step = (dt) => { const s = L.shoot; s.t -= dt; if (s.t < -0.9) { s.t = rand(3, 8); s.x = rand(W * 0.1, W * 0.7); s.y = rand(floor * 0.05, floor * 0.4); } };

// ===== world.js =====
// ---------- World: where the doodling lives. Wake it, play, feed, teach, show ----------
const SNACK_LIST = [
  { k: 'pepper', fx: 'fire', dur: 14 }, { k: 'star', fx: 'glow', dur: 16 },
  { k: 'gum', fx: 'float', dur: 11 }, { k: 'mushroom', fx: 'giant', dur: 15 },
  { k: 'pea', fx: 'tiny', dur: 15 }, { k: 'rainbow', fx: 'rainbow', dur: 16 },
  { k: 'ice', fx: 'ice', dur: 11 }, { k: 'jelly', fx: 'bouncy', dur: 13 },
];
const TRICK_COLORS = [PALETTE[0], PALETTE[5], PALETTE[3], PALETTE[7]];
const MAX_TRICKS = 4;

function worldTheme(color) {
  const [h, s] = hexToHsl(color);
  const H = s < 0.18 ? 0.57 : (h + 0.5) % 1;
  return {
    skyTop: hslToHex(H, 0.62, 0.79), skyBot: hslToHex(H + 0.07, 0.8, 0.93),
    far: hslToHex(H - 0.06, 0.5, 0.8), near: hslToHex(H - 0.12, 0.47, 0.72),
    ground: hslToHex(H - 0.2, 0.5, 0.8), groundLo: hslToHex(H - 0.22, 0.45, 0.68),
    card: hslToHex(H, 0.6, 0.84),
  };
}

// the painted landscape (also used by the keepsake card)
function paintBackdrop(g, W, H, floor, S, theme, seed, part) {
  const r = rng(seed || 1);
  let gr = g.createLinearGradient(0, 0, 0, floor);
  gr.addColorStop(0, theme.skyTop); gr.addColorStop(1, theme.skyBot);
  // sun with a soft halo
  const sx = W * (0.68 + r() * 0.16), sy = floor * (0.2 + r() * 0.1), sr = Math.min(W, H) * 0.09;
  if (part !== 'land') {
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    gr = g.createRadialGradient(sx, sy, sr * 0.6, sx, sy, sr * 4.2);
    gr.addColorStop(0, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, floor);
    g.fillStyle = 'rgba(255,255,255,0.92)'; g.beginPath(); g.arc(sx, sy, sr, 0, TAU); g.fill();
  }
  if (part === 'sky') return;
  // rolling hills
  const hill = (base, amp, col, f1, f2, ph) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, base - amp * (0.6 * Math.sin((x / W) * f1 + ph) + 0.4 * Math.sin((x / W) * f2 + ph * 2.3)));
    g.lineTo(W, H); g.closePath(); g.fill();
  };
  hill(floor - S * 1.15, S * 0.55, theme.far, 4.2, 9.1, r() * 6);
  hill(floor - S * 0.62, S * 0.36, theme.near, 5.6, 12.3, r() * 6);
  // ground
  const top = floor - S * 0.3;
  gr = g.createLinearGradient(0, top, 0, H);
  gr.addColorStop(0, theme.ground); gr.addColorStop(1, theme.groundLo);
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(0, top + 6);
  g.quadraticCurveTo(W * 0.5, top - S * 0.16, W, top + 6); g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();

  function enter(args) {

    show.on = false; show.amt = 0; night = 0; shake = 0; flash = 0; fire.t = 0;

  }

  // ----- reactions -----
  function onLand(hit) {

  function boop(p) {

  }

  }

  // ----- snacks -----
  function spawnSnack(k, x, y, vx, vy) {
    const free = items.filter((i) => i.state === 'free');

    const r = baseS * 0.3;
    items.push({ k, x: clamp(x, r, App.W - r), y: Math.min(y, env.floor - r), vx, vy, r, rot: 0, vr: rand(-3, 3), state: 'free', t: 0, rest: 0 });

    for (let j = 0; j < 3; j++) fxp.emit('dot', c.x + rand(-0.4, 0.4) * c.S, c.y - c.S * 0.2, { vy: -90 - j * 40, vx: rand(-30, 30), size: 5, life: 1.1, color: col });

  // a visitor arrives: it drops in beside the doodling, says hello in its own voice and shows its trick

  function steam() {

  function endFx(name, quiet) {
    if (name === 'giant' || name === 'tiny') { if (!c.fx.giant && !c.fx.tiny) c.scT = 1; syncVoice(); }
    if (name === 'ice') ai.cracks = 0;
    if (!quiet) {
      fxp.burst('puff', c.x, c.y, 7, { speed: 170, size: c.S * 0.26, life: 0.6, color: 'rgba(255,255,255,0.85)', drag: 3 });
      Sound.sfx('poof');

  }

  function breathe() {
    if (fire.t > 0) return;
    const m = c.mouthPos();
    let a;
    if (c.lookAt && hypot(c.lookAt.x - m[0], c.lookAt.y - m[1]) > c.S * 0.6) a = Math.atan2(c.lookAt.y - m[1], c.lookAt.x - m[0]);
    else a = ai.dir > 0 ? -0.25 : Math.PI + 0.25;
    fire.t = 0.6; fire.a = a; c.mouthHold = 1; c.qv -= 2.2;

    delete c.fx.float; endFx('float', true);

    c.setMood('wide', 1.3); c.airT = 1;

  // ----- tricks -----
  function toggleTeach() {
    if (teach.rec) return;
    if (!teach.armed && d.tricks.length >= MAX_TRICKS) { wiggle(trickPanel); Sound.sfx('error'); return; }
    if (!teach.armed && busy()) { Sound.sfx('error'); return; }
    teach.armed = !teach.armed; teach.hint = 0;
    recBtn.classList.toggle('on', teach.armed);
    if (teach.armed) { if (show.on) toggleShow(); Sound.sfx('recStart'); c.setMood('wide', 1.2); Sound.voice('question'); c.say(0.3); if (c.asleep) napOver(); }
    else Sound.sfx('recStop');
  }
  function startRec() {
    teach.rec = { x0: c.x, y0: c.y, p: [0, 0, 0], time: 0, acc: 0, len: 0, lx: c.x, ly: c.y };
    teach.trail = [];
    Sound.sfx('pick');
  }
  function finishRec() {
    const rec = teach.rec;
    teach.rec = null; teach.armed = false; recBtn.classList.remove('on');
    if (rec.time < 0.45 || rec.len < 1.2) {                 // too small to be a trick: shrug it off
      Sound.sfx('error'); c.setMood('wide', 0.6); teach.trail = [];
      return;
    }
    Sound.sfx('recStop');
    const trick = { p: rec.p.map((v) => Math.round(v * 1000) / 1000) };
    d.tricks.push(trick);
    const i = d.tricks.length - 1;
    ai.busy = 'think';
    c.setMood('think', 1.1); Sound.voice('question'); c.say(0.3);
    after(1.15, () => { ai.busy = null; perform(i, true); });
  }
  function perform(i, learned) {
    const trick = d.tricks[i];
    if (!trick || teach.perf) return;
    const p = trick.p, n = p.length / 3;
    let minX = 0, maxX = 0, minY = 0;
    for (let k = 0; k < n; k++) { minX = Math.min(minX, p[k * 3]); maxX = Math.max(maxX, p[k * 3]); minY = Math.min(minY, p[k * 3 + 1]); }
    const m = baseS * 0.8, lo = m - minX * baseS, hi = App.W - m - maxX * baseS;
    const x0 = lo <= hi ? clamp(c.x, lo, hi) : (lo + hi) / 2;

    c.setMood('happy', n / 30 + 0.5);
    Sound.voice('whee'); c.say(0.3);
  }
  function endPerform() {

      c.setMood('proud', 2);
      fxp.burst('confetti', c.x, c.y - c.S, 40, { angle: -Math.PI / 2, spread: 1.1, speed: 700, size: 12, life: 2, colors: PALETTE.slice(0, 9), g: 900, drag: 1.4 });

    palsCopy(d.tricks[pf.i]);
  }
  function forget(i) {
    if (teach.perf || teach.rec) return;
    d.tricks.splice(i, 1);
    Sound.sfx('delete'); drawSlots(); App.keep(c);
  }

  // ----- show time -----
  function toggleShow() {
    show.on = !show.on;
    showBtn.classList.toggle('on', show.on);
    if (show.on) {
      if (teach.armed && !teach.rec) toggleTeach();
      if (c.asleep) napOver();
      show.next = 0; show.note = 0; show.t0 = time;
      Sound.music.onBeat = onBeat;
      Sound.music.start({ seed: d.seed, theme: d.tune });
      c.setMood('happy', 1.5);
      if (drawer.dataset.open !== 'tunes') openDrawer('tunes');
    } else { Sound.music.stop(); Sound.music.onBeat = null; if (drawer.dataset.open === 'tunes') openDrawer('tunes'); if (time - show.t0 > 12 && root.classList.contains('on') && App.screen === World && !document.hidden) gained('show'); }
  }
  function onBeat(beat, bar) {
    if (!show.on || App.screen !== World) return;
    show.pulse = 1; show.hue = (show.hue + 0.13) % 1;
    pals.forEach((p, i) => { const k = p.c; if (k.grab || p.perf || !k.standing) return; if ((beat + i) % 2) k.hop((i % 2 ? 1 : -1) * (beat > 1 ? 1 : -1) * k.S * 0.9, 0.32); else k.qv -= 3; });
    if (busy() || c.grab) return;
    if (beat === 0 && bar > 0 && bar % 2 === 0) {
      if (d.tricks.length) { perform(show.next++ % d.tricks.length, false); return; }
      if (c.standing) { c.hop(0, 1.1); c.av += pick([-1, 1]) * 13; Sound.voice('whee'); return; }
    }
    if (beat === 0 && bar % 4 === 3) {
      for (const s of [0.12, 0.88]) fxp.burst('confetti', App.W * s, env.floor, 22, { angle: -Math.PI / 2 + (s < 0.5 ? 0.35 : -0.35), spread: 0.5, speed: env.g * 0.55, size: 12, life: 2.2, colors: PALETTE.slice(0, 9), g: 900, drag: 1.2 });
      Sound.sfx('confetti', { gain: 0.6 });
    }
    if (c.fx.ice) return;
    if (c.standing) {
      if (beat % 2 === 1) { ai.dir = -ai.dir; c.hop(ai.dir * c.S * 1.1, 0.3); }
      else c.qv -= 3.2;
    }
  }

  // ----- waking up -----
  function wakeNow() {
    phase = 'play';
    d.awake = true; c.alive = true; c.asleep = false;
    Sound.charge(null); Sound.wake();
    flash = 1; shake = 8;
    const S = c.S;
    fxp.burst('star', c.x, c.y, 26, { speed: S * 7, size: 18, life: 1.1, colors: ['#fff', '#FFC928', d.color, '#FF6FB5'], drag: 2.4 });
    fxp.burst('confetti', c.x, c.y, 46, { speed: 900, size: 12, life: 2.4, colors: PALETTE.slice(0, 9), g: 800, drag: 1.5 });
    for (let i = 0; i < 3; i++) fxp.emit('ring', c.x, c.y, { size: S * (2.5 + i * 1.6), life: 0.6 + i * 0.2, color: '#fff' });
    c.airT = 0; c.hopT = 0; c.hop(0, 1.5); c.setMood('wide', 0.7);
    after(0.55, () => { Sound.voice('hello'); c.say(0.75); c.setMood('happy', 1.6); });
    after(0.3, () => { root.classList.remove('waking'); });
    ai.t = 3; ai.idle = 0;
    App.keep(c);
    if (!d.name) after(2.6, () => { if (!d.name) { nameTag.classList.add('pulse'); popIn(nameTag); } });
    if (App.waiting) { const gd = App.waiting; App.waiting = null; after(3.2, () => welcome(gd)); }
  }
  function napOver() {
    c.asleep = false; ai.idle = 0;
    c.setMood('wide', 0.6); Sound.voice('pop'); c.say(0.2); c.qv += 4;
  }

  // ----- pointer -----
  function down(p) {
    if (phase === 'wake') { wake.holding = true; wake.idle = 0; return; }
    if (ptr) return;
    ai.idle = 0;
    if (c.asleep) napOver();
    if (!teach.perf && ai.busy !== 'eat' && ai.busy !== 'think' && c.hit(p.x, p.y)) {
      const [ux, uy] = c.toLocal(p.x, p.y);
      ptr = { on: true, x: p.x, y: p.y, t0: time, moved: 0, squeezed: false };
      c.grab = { ux, uy, tx: p.x, ty: p.y }; c.kin = null; rocket = null;
      ai.spin = 0;
      if (teach.armed) startRec();
    } else {
      ptr = { on: false, x: p.x, y: p.y, t0: time, moved: 0 };
      const pal = palAt(p);
      if (pal) { const [ux, uy] = pal.c.toLocal(p.x, p.y); ptr.pal = pal; pal.perf = null; pal.c.kin = null; pal.c.grab = { ux, uy, tx: p.x, ty: p.y }; }
      else if (toy && hypot(p.x - toy.x, p.y - toy.y) < toy.r + 24) { ptr.toy = true; toy.grab = true; Sound.sfx('pick'); }
    }
    c.lookAt = { x: p.x, y: p.y };
  }
  function move(p) {
    if (!ptr) { if (c && c.alive && !held) c.lookAt = { x: p.x, y: p.y }; return; }
    ptr.moved += hypot(p.x - ptr.x, p.y - ptr.y);
    ptr.x = p.x; ptr.y = p.y;
    if (ptr.on && c.grab) { c.grab.tx = p.x; c.grab.ty = p.y; }
    if (ptr.pal && ptr.pal.c.grab) { ptr.pal.c.grab.tx = p.x; ptr.pal.c.grab.ty = p.y; }
    c.lookAt = { x: p.x, y: p.y };
  }
  function up(p) {
    if (phase === 'wake') { wake.holding = false; return; }
    if (!ptr) return;
    const t = ptr, dt = time - t.t0;
    ptr = null;
    if (t.on) {
      c.grab = null;
      if (teach.rec) { finishRec(); return; }
      if (t.squeezed) { squeezeRelease(); return; }
      if (t.moved < 14 && dt < 0.4) { boop(p || t); return; }
      const sp = hypot(c.vx, c.vy);
      if (sp > c.S * 9 && !c.fx.ice) { Sound.voice('whee'); c.say(0.35); c.setMood('happy', 0.9); Sound.sfx('whoosh', { gain: 0.5 }); }
      if (ai.spin > 16 && !c.fx.ice) after(0.5, () => { c.setMood('dizzy', 2.2); Sound.voice('dizzy'); });
    } else if (t.pal) {
      const k = t.pal.c; k.grab = null;
      if (t.moved < 14 && dt < 0.4) { fxp.emit('ring', t.x, t.y, { size: 46, life: 0.35, color: 'rgba(255,255,255,0.9)' }); k.poke(t.x, t.y); palVoice(k, 'boop', { pitch: rand(-2, 4) }); k.say(0.14); k.setMood('wide', 0.3); t.pal.tagT = 3; }
      else if (hypot(k.vx, k.vy) > k.S * 9) { palVoice(k, 'whee'); k.say(0.35); k.setMood('happy', 0.9); }
    } else if (t.toy) {
      if (toy) { toy.grab = false; if (hypot(toy.vx, toy.vy) > baseS * 6) Sound.sfx('whoosh', { gain: 0.4 }); }
    } else if (t.moved < 16) {
      fxp.emit('ring', t.x, t.y, { size: 40, life: 0.4, color: 'rgba(255,255,255,0.85)' });
      if (!busy() && c.standing && !c.fx.ice && !c.grab) {
        const dx = t.x - c.x;
        ai.dir = dx >= 0 ? 1 : -1;
        c.hopT = 0;                                       // a call from the child beats whatever it was about to do
        c.hop(clamp(dx * 2.1, -c.S * 7, c.S * 7), t.y < c.y - c.S * 1.6 ? 1.3 : 0.5);
        ai.t = 2.5;
      }
    }
  }

  // ----- frame -----
  function think(dt) {
    if (busy() || c.grab) { ai.idle = 0; return; }
    ai.hopCd -= dt; ai.t -= dt; ai.idle += dt;
    const S = c.S;
    let it = null, best = 1e9;
    for (const i of items) if (i.state === 'free') { const dd = hypot(i.x - c.x, i.y - c.y); if (dd < best) { best = dd; it = i; } }
    if (it && !c.asleep) {
      c.lookAt = { x: it.x, y: it.y };
      const m = c.mouthPos(), dx = it.x - c.x;
      if (hypot(it.x - m[0], it.y - m[1]) < S * 0.9 + it.r) { eat(it); return; }
      if (c.standing && ai.hopCd <= 0 && !c.fx.ice && !c.fx.float && it.rest > 0.15) {
        ai.dir = dx >= 0 ? 1 : -1;
        c.hop(clamp(dx * 2.2, -S * 5.5, S * 5.5), clamp(Math.abs(dx) / (S * 3.2), 0.28, 0.85)); ai.hopCd = 0.4;
      }
      return;
    }
    if (c.fx.bouncy && c.standing && ai.hopCd <= 0) { c.hop(rand(-1, 1) * S * 3, 1.25); ai.hopCd = 0.2; return; }
    if (show.on) return;
    if (c.asleep) {
      ai.snore -= dt;
      if (ai.snore <= 0) { ai.snore = 3.4; Sound.voice('snore'); c.qv += 1.2; const f = c.facePos(); fxp.emit('zzz', f[0] + S * 0.5, f[1] - S * 0.5, { vy: -40, vx: 14, size: 13, life: 2.4, color: INK, vr: 0 }); }
      return;
    }
    if (ai.idle > 45 && c.standing && !Object.keys(c.fx).length) { c.asleep = true; ai.snore = 0.8; Sound.voice('yawn'); c.lookAt = null; return; }
    if (ai.t <= 0) {
      ai.t = rand(2.4, 5.2);
      const r = Math.random();
      if (c.fx.ice) return;
      if (toy && !toy.grab && !ai.stay && r < 0.3 && c.standing) { const dx = toy.x - c.x; ai.dir = dx >= 0 ? 1 : -1; c.lookAt = { x: toy.x, y: toy.y }; c.hop(clamp(dx * 2.2, -S * 5.5, S * 5.5), 0.5); }
      else if (r < 0.4 && c.standing) { ai.dir = Math.random() < 0.5 ? -1 : 1; if (c.x < App.W * 0.2) ai.dir = 1; if (c.x > App.W * 0.8) ai.dir = -1; c.hop(ai.dir * S * rand(1, 2.6), rand(0.3, 0.6)); }
      else if (r < 0.55) { Sound.voice('happy', { gain: 0.6 }); c.say(0.3); c.setMood('happy', 0.9); }
      else if (r < 0.65 && c.standing) { c.hop(0, 0.9); c.av += pick([-1, 1]) * 12; }
      else c.lookAt = null;
    }
  }

  function step(dt) {
    time += dt;
    for (let i = timers.length - 1; i >= 0; i--) if (timers[i].t <= time) { const f = timers[i].fn; timers.splice(i, 1); f(); }

    // waking: press and hold
    if (phase === 'wake') {
      dark = damp(dark, 0.78, 4, dt);
      wake.idle += dt;
      if (wake.holding) {
        wake.charge += dt / 1.7;
        wake.beat -= dt;
        if (wake.beat <= 0) { wake.beat = lerp(0.62, 0.2, wake.charge); c.qv += 2.4; fxp.emit('ring', c.x, c.y, { size: c.S * 1.9, life: 0.45, color: 'rgba(255,240,190,0.9)' }); }
        const a = rand(TAU), r = c.S * rand(2.4, 3.6);
        fxp.emit('spark', c.x + Math.cos(a) * r, c.y + Math.sin(a) * r, { vx: -Math.cos(a) * r * 2.2, vy: -Math.sin(a) * r * 2.2, size: rand(3, 6), life: 0.45, color: pick(['#fff', '#FFE9A8', d.color]) });
        Sound.charge(clamp01(wake.charge));
        if (wake.charge >= 1) wakeNow();
      } else if (wake.charge > 0) {
        wake.charge = Math.max(0, wake.charge - dt * 1.4);
        Sound.charge(wake.charge > 0 ? wake.charge : null);
      }
    } else dark = damp(dark, 0, 3.5, dt);

    // squeeze: hold still on it
    if (ptr && ptr.on && c.grab && !teach.rec) {
      const hold = time - ptr.t0;
      if (ptr.moved < 12 && hold > 0.42) {
        if (!ptr.squeezed) { ptr.squeezed = true; Sound.voice('squeeze'); Sound.sfx('squish', { gain: 0.5 }); c.setMood('happy', 3); }
        c.qT = -0.3 * Math.min(1, (hold - 0.42) * 3);
      } else if (ptr.squeezed && ptr.moved >= 12) { ptr.squeezed = false; c.qT = 0; }

      }
    }

    // taught trick playback

      const f = clamp(pf.t * 30, 0, pf.n - 1), i0 = Math.floor(f), i1 = Math.min(pf.n - 1, i0 + 1), u = f - i0, p = d.tricks[pf.i].p;
      const S = baseS;
      c.kin = {
        x: clamp(pf.x0 + lerp(p[i0 * 3], p[i1 * 3], u) * S, S * 0.4, App.W - S * 0.4),
        y: clamp(pf.y0 + lerp(p[i0 * 3 + 1], p[i1 * 3 + 1], u) * S, S * 0.4, env.floor),
        a: p[i0 * 3 + 2] + wrapAngle(p[i1 * 3 + 2] - p[i0 * 3 + 2]) * u,
      };
      if (pf.t > 0) teach.trail.push({ x: c.x, y: c.y, t: time, c: pf.color });
      if (pf.t * 30 >= pf.n - 1 + 4) endPerform();
    }
    // recording a new trick
    const rec = teach.rec;
    if (rec) {
      rec.time += dt; rec.acc += dt;
      rec.len += hypot(c.x - rec.lx, c.y - rec.ly) / baseS; rec.lx = c.x; rec.ly = c.y;
      while (rec.acc >= 1 / 30) { rec.acc -= 1 / 30; rec.p.push((c.x - rec.x0) / baseS, (c.y - rec.y0) / baseS, c.ang); }
      teach.trail.push({ x: c.x, y: c.y, t: time, c: TRICK_COLORS[d.tricks.length] });
      if (rec.time >= 6) { c.grab = null; if (ptr) ptr = null; finishRec(); }
    }
    while (teach.trail.length && time - teach.trail[0].t > 1.6) teach.trail.shift();

    // effects that act every frame
    const S = c.S;
    if (c.fx.fire && phase === 'play') {
      ai.fireT -= dt;
      if (ai.fireT <= 0 && !busy() && !c.grab) { ai.fireT = rand(2.2, 3.4); breathe(); }
      if (Math.random() < dt * 5) { const f = c.facePos(); fxp.emit('puff', f[0] + rand(-S, S) * 0.5, f[1] - S * 0.7, { vy: -110, size: S * 0.07, life: 0.8, color: 'rgba(255,255,255,0.45)' }); }
    }
    if (fire.t > 0) {
      fire.t -= dt;
      const m = c.mouthPos();
      for (let i = 0; i < 3; i++) {
        const a = fire.a + rand(-0.26, 0.26), sp = S * rand(5, 10);
        fxp.emit('flame', m[0], m[1], { vx: Math.cos(a) * sp + c.vx, vy: Math.sin(a) * sp + c.vy, size: S * rand(0.16, 0.3), life: rand(0.3, 0.55), g: -500, drag: 1.5 });
      }
    }
    if (c.fx.ice) { for (let i = 0; i < c.n; i += 2) c.ovx[i] += rand(-1, 1) * S * 1.4; }
    if (c.fx.glow && Math.random() < dt * 7) fxp.emit('star', c.x + rand(-1, 1) * S * 1.2, c.y + rand(-1, 1) * S * 1.2, { size: rand(7, 14), life: 0.9, color: '#FFF3B0', vy: -20, vr: 1, back: Math.random() < 0.5 });
    if (c.fx.rainbow && hypot(c.vx, c.vy) > 70) fxp.emit('dot', c.x + rand(-0.3, 0.3) * S, c.y + rand(-0.3, 0.3) * S, { size: S * rand(0.1, 0.2), life: 0.6, color: hslToHex(time * 0.9, 0.9, 0.62), back: true });
    if (c.fx.float && !c.grab && Math.random() < dt * 2) fxp.emit('bubble', c.x + rand(-S, S), c.y + S, { vy: -60, size: rand(4, 9), life: 1.4, color: 'rgba(255,255,255,0.9)', back: true });
    if (rocket) {
      rocket.t -= dt; rocket.a += rand(-9, 9) * dt * 3;
      c.vx += Math.cos(rocket.a) * env.g * 3.2 * dt; c.vy += Math.sin(rocket.a) * env.g * 3.2 * dt - env.g * dt * 0.8;
      c.av += 34 * dt;
      fxp.emit('puff', c.x, c.y, { vx: -Math.cos(rocket.a) * 200, vy: -Math.sin(rocket.a) * 200, size: S * 0.2, life: 0.45, color: '#FFD3EA', back: true });

    show.pulse = Math.max(0, show.pulse - dt * 3.2);
    shake = Math.max(0, shake - dt * 40);
    flash = Math.max(0, flash - dt * 1.7);
    syncVoice();

    think(dt);
    c.step(dt, env);
    stepPals(dt);
    GrowHud.step(dt);
    for (const p of pals) p.tagT = Math.max(0, p.tagT - dt);
    // ready to grow a look? Only in a quiet moment, never in the middle of something
    if (phase === 'play' && !busy() && !c.grab && !show.on && !held && !GrowHud.busy && document.activeElement !== nameTag) { lookT -= dt; if (lookT <= 0) { lookT = 2; offerLook(c, (wore) => { lookT = 1e9;   /* one growing moment at a time: the next waits for the next thing it does, or the next visit */ fxp.burst('star', c.x, c.y, 20, { speed: c.S * 6, size: 16, life: 1, colors: ['#fff', '#FFC928', d.color], drag: 2.6 }); c.setMood('happy', 2); Sound.voice(wore ? 'tada' : 'happy'); c.say(0.5); if (c.standing) c.hop(0, 1.2); }); } }
    if (toy) stepToy(dt);
    amb.step(dt, c);
    if (wipe) { wipe.t += dt; if (wipe.t > 0.7) wipe = null; }
    goal = Math.max(0, goal - dt);
    if (place === 'sea' && Math.random() < dt * 1.5) fxp.emit('bubble', c.x + rand(-0.5, 0.5) * c.S, c.y - c.S * 0.5, { vy: -70, size: rand(4, 8), life: 1.6, color: 'rgba(255,255,255,0.9)' });

    // snacks: fall, bounce, get eaten
    for (let i = items.length - 1; i >= 0; i--) {

        it.x = lerp(it.sx, m[0], ease.inOut(k)); it.y = lerp(it.sy, m[1], ease.inOut(k)) - Math.sin(k * Math.PI) * c.S * 0.25;

      }
      it.vy += env.g * dt; it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.vr * dt;
      if (it.y + it.r > env.floor) { it.y = env.floor - it.r; if (it.vy > 120) Sound.sfx('drop', { gain: clamp(it.vy / 2500, 0.15, 0.6) }); it.vy = it.vy > 160 ? -it.vy * 0.45 : 0; it.vx *= 0.8; it.vr = it.vx / it.r; }
      if (it.x < it.r) { it.x = it.r; it.vx = Math.abs(it.vx) * 0.6; }
      if (it.x > App.W - it.r) { it.x = App.W - it.r; it.vx = -Math.abs(it.vx) * 0.6; }
      it.rest = Math.abs(it.vy) < 40 && it.y + it.r >= env.floor - 2 ? it.rest + dt : 0;
    }
    for (const cl of clouds) { cl.x += cl.v * dt; if (cl.x - cl.s * 2 > App.W) cl.x = -cl.s * 2; }
  }

  function draw(g) {
    const W = App.W, H = App.H, S = c.S;
    if (wipe) {                                           // a new place opens out from the doodling
      g.drawImage(wipe.old, 0, 0, W, H);
      g.save(); g.beginPath(); g.arc(c.x, c.y, ease.out(clamp01(wipe.t / 0.7)) * hypot(W, H), 0, TAU); g.clip();
      g.drawImage(backdrop, 0, 0, W, H); amb.back(g);
      g.restore();
    } else { g.drawImage(backdrop, 0, 0, W, H); amb.back(g); }
    if (goal > 0) {                                       // the goal light
      const n = amb.net, a = Math.min(1, goal) * (0.5 + 0.5 * Math.sin(time * 22));
      if (n) { const gr = g.createRadialGradient(n.x + n.w / 2, env.floor - n.h * 1.2, 0, n.x + n.w / 2, env.floor - n.h * 1.2, baseS * 2.6); gr.addColorStop(0, `rgba(255,70,60,${0.75 * a})`); gr.addColorStop(1, 'rgba(255,70,60,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
    }
    g.fillStyle = 'rgba(255,255,255,0.72)';
    for (const cl of clouds) {
      g.beginPath(); g.ellipse(cl.x, cl.y, cl.s, cl.s * 0.3, 0, 0, TAU); g.ellipse(cl.x - cl.s * 0.35, cl.y - cl.s * 0.18, cl.s * 0.45, cl.s * 0.3, 0, 0, TAU); g.ellipse(cl.x + cl.s * 0.3, cl.y - cl.s * 0.24, cl.s * 0.5, cl.s * 0.36, 0, 0, TAU); g.fill();
    }
    if (Grow.shows(d, 'bunting')) drawBunting(g, -10, W + 10, 70, 22, clamp(W / 28, 13, 24), time);
    const dim = Math.max(night * 0.68, show.amt * 0.74);
    if (dim > 0.01) {
      g.fillStyle = `rgba(22,18,66,${dim})`; g.fillRect(0, 0, W, H);
      const r = rng(d.seed + 9);
      for (let i = 0; i < 46; i++) {
        const x = r() * W, y = r() * env.floor * 0.9, tw = 0.5 + 0.5 * Math.sin(time * (1 + r() * 2.5) + i);
        g.globalAlpha = dim * (0.35 + tw * 0.65); g.fillStyle = '#FFF6D0';
        g.beginPath(); g.arc(x, y, 1 + r() * 2, 0, TAU); g.fill();
      }
      g.globalAlpha = 1;
    }
    if (show.amt > 0.01) {                                // stage lights
      g.save(); g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) {
        const fromX = W * (0.12 + i * 0.38), sway = Math.sin(time * 1.3 + i * 2.1) * W * 0.12, tx = lerp(c.x, W / 2, 0.5) + sway * (i === 1 ? 0.4 : 1);
        const col = hslToHex(show.hue + i * 0.33, 0.9, 0.6);
        const gr = g.createLinearGradient(fromX, 0, tx, env.floor);
        gr.addColorStop(0, rgba(col, 0.36 * show.amt * (0.7 + show.pulse * 0.3))); gr.addColorStop(1, rgba(col, 0.03));
        g.fillStyle = gr;
        g.beginPath(); g.moveTo(fromX - 12, -10); g.lineTo(fromX + 12, -10); g.lineTo(tx + S * 1.7, env.floor + S * 0.2); g.lineTo(tx - S * 1.7, env.floor + S * 0.2); g.closePath(); g.fill();

// ---------- Card: the keepsake to take home (a picture, a name, and a QR that brings it back to life) ----------
const FONT = '"SF Pro Rounded", ui-rounded, "Arial Rounded MT Bold", "Nunito", "Varela Round", system-ui, sans-serif';

// the wordmark: plain round letters whose two o's are eyes
function drawWordmark(g, cx, cy, h, look, blink, color = INK) {
  const u = h / 3.6, w = 0.46;
  const glyphs = 'doodlings';
  const adv = { d: 2.55, o: 2.5, l: 0.95, i: 0.95, n: 2.2, g: 2.55, s: 1.9 };
  let total = 0;
  for (const ch of glyphs) total += adv[ch];
  total -= 0.5;
  g.save();
  g.translate(cx - (total * u) / 2, cy + 0.8 * u);
  g.scale(u, u);
  g.lineCap = g.lineJoin = 'round'; g.strokeStyle = color; g.fillStyle = color; g.lineWidth = w;
  let x = 0, eye = 0;
  for (const ch of glyphs) {
    g.save(); g.translate(x, 0);
    if (ch === 'd') { g.beginPath(); g.arc(1, 0, 1, 0, TAU); g.moveTo(2, -2.7); g.lineTo(2, 1); g.stroke(); }
    else if (ch === 'o') {
      g.beginPath(); g.arc(1, 0, 1, 0, TAU); g.fillStyle = '#fff'; g.fill(); g.stroke();
      const open = blink ? 0.12 : 1;
      g.fillStyle = color; g.beginPath(); g.ellipse(1 + (look ? look.x : 0) * 0.36, (look ? look.y : 0) * 0.36, 0.44, 0.44 * open, 0, 0, TAU); g.fill();
      if (!blink) { g.fillStyle = '#fff'; g.beginPath(); g.arc(0.84 + (look ? look.x : 0) * 0.36, -0.17 + (look ? look.y : 0) * 0.36, 0.15, 0, TAU); g.fill(); }
      eye++;
    } else if (ch === 'l') { g.beginPath(); g.moveTo(0.23, -2.7); g.lineTo(0.23, 1); g.stroke(); }
    else if (ch === 'i') { g.beginPath(); g.moveTo(0.23, -1); g.lineTo(0.23, 1); g.stroke(); g.beginPath(); g.arc(0.23, -2.05, 0.33, 0, TAU); g.fill(); }
    else if (ch === 'n') { g.beginPath(); g.moveTo(0.23, -1); g.lineTo(0.23, 1); g.moveTo(0.23, -0.1); g.arc(1.05, -0.18, 0.82, Math.PI, 0); g.lineTo(1.87, 1); g.stroke(); }
    else if (ch === 'g') { g.beginPath(); g.arc(1, 0, 1, 0, TAU); g.moveTo(2, -1); g.lineTo(2, 1.75); g.arc(1, 1.75, 1, 0, Math.PI * 0.8); g.stroke(); }
    else if (ch === 's') { g.beginPath(); g.moveTo(1.32, -0.62); g.bezierCurveTo(1.0, -1.2, 0.0, -1.1, 0.14, -0.4); g.bezierCurveTo(0.25, 0.12, 1.4, -0.1, 1.4, 0.5); g.bezierCurveTo(1.36, 1.15, 0.3, 1.2, 0.05, 0.6); g.stroke(); }
    g.restore();
    x += adv[ch];
  }
  g.restore();
}

const Card = (() => {
  const CW = 1080, CH = 1440;

  }
  // The big code to hold up to a camera. Two kinds: the house takes the doodling home, with everything it has grown and won.
  // The suitcase sends it visiting: it arrives at a friend's as a guest, and stays the sender's own.
  function showQR(visit) {
    const url = visit ? location.origin + location.pathname + '#v=' + Codec.encode(d, 1200, true) : link;
    const code = visit ? QR.encode(url, { ecc: 'L' }) : qr;
    if (!code) return;
    const q = qrCv.getContext('2d');

    QR.draw(q, code, 30, 30, 840, { dark: INK, light: '#ffffff', quiet: 2, round: 0 });
    qrKind.innerHTML = ICONS[visit ? 'suitcase' : 'home']; qrWrap.dataset.kind = visit ? 'visit' : 'home';

  function open(critter, pals = []) {

      for (const [x, y] of [[px, py], [px + pw, py], [px, py + ph], [px + pw, py + ph]]) { g.fillStyle = '#FFC928'; g.strokeStyle = inkOf('#FFC928'); g.lineWidth = 5; g.beginPath(); g.arc(x, y, 30, 0, TAU); g.fill(); g.stroke(); g.fillStyle = '#FF5A4E'; g.beginPath(); g.arc(x, y, 12, 0, TAU); g.fill(); }

    levelBtn = iconBtn('lv1', '', root, 'Harder or easier', () => { if (phase !== 'ready' && phase !== 'done') return; Sound.sfx('tap', { pitch: level * 3 }); level = (level % 3) + 1; reset(); });
  }
  function syncBar() {

    setIcon(swapBtn, role === 'shoot' ? 'glove' : 'ball'); setIcon(levelBtn, 'lv' + level);
    againBtn.classList.toggle('glow', phase === 'done');
  }

  // ----- the pitch, painted once -----
  function layout() {
    const W = App.W, H = App.H, R = SHOOT[sport];
    geo.wide = R.wide; geo.high = R.high; geo.rest = R.rest;
    const low = H < 520;                                    // a phone on its side: the goal fills what height there is
    geo.U = Math.min((W * 0.88) / 2, (H * (low ? 0.4 : 0.3)) / 0.84, 260);
    geo.bx = W / 2; geo.gy = low ? 72 + 0.84 * geo.U : Math.max(136 + 0.84 * geo.U, H * 0.43); geo.by = H - (low ? 66 : Math.max(96, H * 0.16));
    env.floor = geo.by + geo.U * 0.2;
    const dpr = App.dpr, cv = (bg = document.createElement('canvas'));
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const U = geo.U, gy = geo.gy, hz = gy - U * 0.2, ice = sport === 'hockey';
    // the far side: sky, a hill or the boards, a string of flags
    let gr = g.createLinearGradient(0, 0, 0, hz); gr.addColorStop(0, ice ? '#7FB8EE' : '#7CCBF5'); gr.addColorStop(1, ice ? '#DCEBFA' : '#DDF3FB');
    g.fillStyle = gr; g.fillRect(0, 0, W, hz + 2);
    if (ice) {
      for (const [col, y0, h] of [['#F4F8FF', hz - U * 0.5, U * 0.5], ['#FFC928', hz - U * 0.07, U * 0.07]]) { g.fillStyle = col; g.fillRect(0, y0, W, h); }
      g.strokeStyle = 'rgba(43,45,66,0.25)'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, hz - U * 0.5); g.lineTo(W, hz - U * 0.5); g.stroke();
      const r = rng(5);                                     // a crowd behind the glass: just dots of colour
      for (let i = 0; i < W / 9; i++) { g.fillStyle = rgba(PALETTE[(r() * 9) | 0], 0.75); g.beginPath(); g.arc(r() * W, hz - U * (0.56 + r() * 0.34), 5 + r() * 5, 0, TAU); g.fill(); }
    } else {
      const hill = (base, amp, col, f, ph) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, hz + 2); for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, base - amp * (0.6 * Math.sin((x / W) * f + ph) + 0.4 * Math.sin((x / W) * f * 2.3 + ph * 2))); g.lineTo(W, hz + 2); g.fill(); };
      hill(hz - U * 0.42, U * 0.16, '#A8DDB0', 5, 1); hill(hz - U * 0.2, U * 0.12, '#8ED095', 7, 3.1);
      g.fillStyle = 'rgba(255,255,255,0.85)'; for (const [x, y, s] of [[0.16, 0.2, 1], [0.72, 0.12, 1.3], [0.9, 0.3, 0.8]]) { g.beginPath(); g.ellipse(W * x, hz * y + 30, U * 0.3 * s, U * 0.09 * s, 0, 0, TAU); g.ellipse(W * x - U * 0.12 * s, hz * y + 30 - U * 0.06 * s, U * 0.16 * s, U * 0.1 * s, 0, 0, TAU); g.fill(); }

    if (!ice) {                                             // mown stripes
      g.fillStyle = 'rgba(255,255,255,0.1)';
      for (let i = 0; i < 6; i += 2) { const y0 = lerp(hz, H, (i / 6) ** 1.6), y1 = lerp(hz, H, ((i + 1) / 6) ** 1.6); g.fillRect(0, y0, W, y1 - y0); }
    } else {
      g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 2; const r = rng(9);

    }

    g.lineCap = 'round'; g.strokeStyle = ice ? '#FF5A4E' : 'rgba(255,255,255,0.9)'; g.lineWidth = Math.max(3, U * 0.035);
    g.beginPath(); g.moveTo(0, gy); g.lineTo(W, gy); g.stroke();
    if (ice) { g.fillStyle = 'rgba(53,182,242,0.3)'; g.strokeStyle = '#FF5A4E'; g.beginPath(); g.ellipse(geo.bx, gy, U * 1.15, U * 0.42, 0, 0, Math.PI); g.fill(); g.stroke(); }
    else { g.beginPath(); g.moveTo(geo.bx - U * 1.5, gy); g.lineTo(geo.bx - U * 2.0, gy + U * 0.75); g.lineTo(geo.bx + U * 2.0, gy + U * 0.75); g.lineTo(geo.bx + U * 1.5, gy); g.stroke(); g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.ellipse(geo.bx, geo.by + U * 0.2, U * 0.12, U * 0.04, 0, 0, TAU); g.fill(); }
  }

  // ----- a round -----
  function reset() {

    best = (d.best && d.best[key()]) || 0;
    kp.u = kp.tu = 0; kp.v = kp.tv = geo.rest; kp.vu = 0; kp.ph = rand(TAU);
    layout(); place(); syncBar(); GrowHud.hide();
    Sound.setVoice({ size: 0.5, seed: d.seed, style: d.voice });
  }
  // stand everybody where they belong. Every keeper is drawn the size of the catch ring, whatever it looked like when it was drawn.
  function place() {
    const K = keeperOf(), O = kickerOf(), U = geo.U;
    for (const k of [K, O]) { k.fx = {}; k.sc = k.scT = 1; k.grab = k.kin = null; k.alive = true; k.asleep = false; k.mood = 'idle'; k.mouthHold = 0; k.qT = 0; k.vx = k.vy = k.av = 0; k.ang = 0; k.lookAt = null; k.onLand = k.onWall = k.onFxEnd = k.onHop = null; }
    K.baseS = U * SHOOT.catch * 1.1; K.x = X(kp.u); K.y = Y(kp.v);
    O.baseS = U * 0.3; O.x = Math.max(O.baseS * 1.5, geo.bx - U * (role === 'shoot' ? 0.82 : 0.7)); O.y = env.floor - O.baseS;
    K.refreshParts(); O.refreshParts();
  }
  function start(o) {
    c = o.critter; d = c.d; pal = o.pal; sport = o.sport; fxp = App.fx; fxp.clear();
    role = 'shoot'; level = 1; time = 0;
    root.classList.toggle('ice', sport === 'hockey');
    reset();
  }
  function stop() { root.classList.remove('on'); for (const k of [c, pal]) if (k) { k.kin = null; k.fx = {}; k.sc = k.scT = 1; } }
  function nextBall() {
    ball.on = false; ball.out = null; idle = 0; waitT = 0;
    if (role !== 'keep') ptr = null;                        // a keeper's finger stays down from one shot to the next
    if (shotN >= SHOOT.balls) { finish(); return; }
    phase = 'aim'; syncBar();
  }

  // A flick becomes a shot: where the swipe points is where the ball goes, and a faster swipe goes higher and gets there sooner.
  function aim(dx, dy, speed) {
    const midY = geo.gy - geo.high * geo.U * 0.5, u = (dx / -dy) * (geo.by - midY) / geo.U;

  }
  function shoot(s) {

  // the ball has reached the goal line: what happened?
  function land() {

    const saved = hypot(ball.u - kp.u, ball.v - kp.v) < R.catch + R.ball;
    ball.out = saved ? 'save' : inside ? 'goal' : post ? 'post' : 'wide'; ball.after = 0;
    const K = keeperOf(), O = kickerOf(), bx = (ball.x = X(ball.u)), by = (ball.y = Y(ball.v)), good = role === 'shoot' ? ball.out === 'goal' : ball.out === 'save';
    marks.push(good ? 1 : 0);

      Sound.sfx('squish', { gain: 0.7 }); K.poke(bx, by, 1.4); K.setMood('proud', 1.4);
      Sound.setVoice({ size: 0.45, seed: K.d.seed, style: K.d.voice }); Sound.voice(good ? 'tada' : 'happy'); K.say(0.5);
      fxp.emit('ring', bx, by, { size: geo.U * 0.5, life: 0.4, color: '#fff' });
      fxp.burst('star', bx, by, 9, { speed: geo.U * 2.4, size: 13, life: 0.6, colors: ['#fff', '#FFC928'], drag: 3 });
    } else if (ball.out === 'goal') {
      net.t = 0; net.u = ball.u; net.v = ball.v; shake = 7;
      Sound.sfx('learn', { gain: 0.8 }); if (good) Sound.sfx('confetti', { gain: 0.6 });
      K.setMood(good ? 'dizzy' : 'wide', 1.3);
      if (good) fxp.burst('confetti', bx, by, 34, { angle: -Math.PI / 2, spread: 1.3, speed: 700, size: 11, life: 1.8, colors: PALETTE.slice(0, 9), g: 900, drag: 1.5 });
    } else if (ball.out === 'post') {
      ball.vx = Math.sign(ball.u || 1) * geo.U * 2.4; ball.vy = -geo.U * 1.6; shake = 5;
      Sound.sfx('crack'); Sound.sfx('thud', { gain: 0.4, pitch: 9 });
    } else Sound.sfx('swipe', { gain: 0.3 });
    if (good) { O.setMood('happy', 1.4); if (O.standing) O.hop(0, 1.1); if (role === 'shoot') { Sound.setVoice({ size: 0.5, seed: d.seed, style: d.voice }); Sound.voice('tada'); c.say(0.5); } }
    else if (role === 'shoot') { c.setMood('wide', 0.8); if (ball.out !== 'save') { Sound.setVoice({ size: 0.5, seed: d.seed, style: d.voice }); Sound.voice('oof'); c.say(0.3); } }
    else { c.setMood('wide', 0.9); if (ball.out === 'goal') { Sound.setVoice({ size: 0.45, seed: pal.d.seed, style: pal.d.voice }); Sound.voice('happy'); pal.say(0.4); } }

  }
  // five balls taken: the round counts, whatever the score
  function finish() {
    phase = 'done';
    const score = marks.reduce((a, b) => a + b, 0);
    newBest = score > best;
    if (newBest) { d.best[key()] = best = score; }
    const rep = Grow.earn(d, role, { bonus: score >= 4, tickets: 2 + (newBest ? 1 : 0) });
    GrowHud.show(d, rep);
    App.keep(c);
    Sound.sfx(newBest ? 'magic' : 'learn');
    if (newBest) { flash = 0.5; for (const s of [0.2, 0.8]) fxp.burst('confetti', App.W * s, App.H * 0.5, 30, { angle: -Math.PI / 2, spread: 0.7, speed: 800, size: 12, life: 2.2, colors: PALETTE.slice(0, 9), g: 900, drag: 1.3 }); Sound.sfx('confetti'); }
    c.setMood(score >= 3 ? 'proud' : 'happy', 2.5); if (c.standing) c.hop(0, 1.1);
    Sound.setVoice({ size: 0.5, seed: d.seed, style: d.voice }); Sound.voice(score >= 3 ? 'tada' : 'happy'); c.say(0.6);
    syncBar();
  }

  // ----- pointer -----
  function down(p) {
    idle = 0;
    if (phase === 'ready') { phase = 'aim'; syncBar(); }
    if (phase !== 'aim' && !(role === 'keep' && (phase === 'fly' || phase === 'after'))) return;
    ptr = { x: p.x, y: p.y, x0: p.x, y0: p.y, t0: time, trail: [[p.x, p.y, time]] };
  }
  function move(p) {
    if (!ptr) return;

      kp.tu = clamp(kp.tu + ((p.x - ptr.x) / geo.U) * 1.35, -geo.wide, geo.wide);
      if (sport === 'soccer') kp.tv = clamp(kp.tv - ((p.y - ptr.y) / geo.U) * 1.35, geo.rest, geo.high - 0.12);
    }
    ptr.x = p.x; ptr.y = p.y; ptr.trail.push([p.x, p.y, time]);

  }
  function up(p) {

    const dx = t.x - t.x0, dy = t.y - t.y0;
    if (dy > -24) { if (hypot(dx, dy) < 14) { c.poke(c.x, c.y); idle = 9; } return; }         // not a flick: show how again

  // ----- frame -----
  function step(dt) {

        const du = tu - kp.u, dv = tv - kp.v, dd = hypot(du, dv), go = Math.min(dd, lv.speed * (SHOOT[sport].quick || 1) * dt);

  // where the ball is on screen, and how big, u01 of the way to the goal line

  }
  function drawBall(g, x, y, r, rot) {

      g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = Math.max(1, r * 0.1); g.beginPath(); g.ellipse(0, -r * 0.1, r * 0.6, r * 0.22, 0, 3.4, 4.6); g.stroke();

      for (let j = 0; j <= nyn; j++) { const y = lerp(y0 + dy * 0.5, y1 - dy, j / nyn); for (let i = 0; i <= 8; i++) { const [px, py] = push(lerp(x0 + dx * 0.6, x1 - dx * 0.6, i / 8), y); if (i) g.lineTo(px, py); else g.moveTo(px, py); } }
      g.stroke();

// A doodling that is ready to grow a look is shown the choice. then(wore) runs after the child has picked.
function offerLook(c, then) {

// ---------- Home: the shelf where doodlings wait ----------
function makeDemo(seed, wear) {
  const r = rng(seed), d = newCreatureData();
  d.id = 'demo' + seed; d.seed = seed; d.awake = true;
  d.color = PALETTE[Math.floor(r() * 9)];
  d.outline = Shape.random(r);
  const c = new Critter(d), m = c.m;
  const put = (k, deg, dist) => {
    const def = PARTS[k]; if (!def) return;
    const a = (deg * Math.PI) / 180, dx = Math.sin(a), dy = -Math.cos(a), e = Shape.edgeAt(d.outline, m.cx, m.cy, dx, dy) || m.r;
    d.parts.push({ k, x: m.cx + dx * e * dist, y: m.cy + dy * e * dist, s: 1, r: def.orient ? a : 0, c: null });
  };
  const eye = ['eyeRound', 'eyeOval', 'eyeDot', 'eyeLash'][Math.floor(r() * 4)];
  if (r() < 0.25) put('eyeBig', 0, 0.3); else { put(eye, -38, 0.46); put(eye, 38, 0.46); }
  put(['mouthSmile', 'mouthOpen', 'mouthFang', 'mouthCat'][Math.floor(r() * 4)], 180, 0.3);
  const bit = ['earRound', 'earPoint', 'earLong', 'horn', 'antenna'][Math.floor(r() * 5)];
  put(bit, -34, 1); put(bit, 34, 1);
  if (r() < 0.6) { put('arm', -98, 1); put('arm', 98, 1); }
  if (r() < 0.6) { put('foot', 155, 1); put('foot', -155, 1); }
  if (r() < 0.4) put('tail', 118, 1);
  for (const [k, deg, dist, col] of wear || []) { const n = d.parts.length; put(k, deg, dist); if (col && d.parts.length > n) d.parts[n].c = col; }
  d.voice = VOICE_LIST[Math.floor(r() * VOICE_LIST.length)];
  c.refreshParts();
  return c;
}

    if (press) { press.t += dt; if (press.t > 0.65 && press.m.saved && press.moved < 20 && doomed !== press.m) { doomed = press.m; doomed.t = 0; Sound.sfx('pick'); press.m.c.setMood('wide', 1); } }
    if (doomed) { doomed.t += dt; if (doomed.t > 4) doomed = null; }
    for (const m of crew) {
      const c = m.c;
      m.t -= dt;
      if (m.t <= 0 && c.alive && c.standing) {
        m.t = rand(1.4, 4.5);
        const back = m.home - c.x;
        c.hop(clamp(back * 1.2 + rand(-1, 1) * S * 1.5, -S * 3, S * 3), rand(0.25, 0.7));
      }
      c.step(dt, env);
    }
  }

  function draw(g) {
    const W = App.W, H = App.H;
    App.paper(g);
    // a soft shelf
    g.save();
    g.fillStyle = 'rgba(214,178,120,0.2)';
    g.beginPath(); g.ellipse(W / 2, env.floor + S * 0.25, Math.min(W * 0.46, S * crew.length * 2.2 + 80), S * 0.5, 0, 0, TAU); g.fill();
    g.restore();
    const wm = clamp(Math.min(W / 9.5, H * 0.13), 40, 120);
    const cx = W / 2, cy = Math.max(wm * 1.5, H * 0.2);
    let lk = null;
    if (look.tx !== undefined) { const dx = look.tx - cx, dy = look.ty - cy, dd = hypot(dx, dy) || 1, k = Math.min(1, dd / 200); look.x = damp(look.x, (dx / dd) * k, 10, App.dt); look.y = damp(look.y, (dy / dd) * k, 10, App.dt); lk = look; }
    drawWordmark(g, cx, cy, wm, lk, blink > 0);
    App.fx.draw(g, true);
    for (const m of crew) { m.c.drawShadow(g, env.floor); }
    for (const m of crew) if (m.saved) {                     // the cups each one has won stand beside it
      const cups = Grow.of(m.c.d).cups.filter(Boolean).sort((a, b) => b - a);
      cups.forEach((medal, i) => drawTrophy(g, m.home + S * (0.95 + i * 0.42), env.floor - S * 0.2 + S * 0.05 * i, S * 0.24, medal));
    }
    for (const m of crew) m.c.draw(g);
    if (App.waiting) {                                       // a visitor is waiting for someone to play with
      if (!waitC || waitC.d !== App.waiting) { waitC = new Critter(App.waiting); waitC.alive = true; }
      const k = waitC, gs = S * 0.8, gx = W - Math.max(S * 1.3, W * 0.08), fy = env.floor + S * 0.5, gy = fy - Math.abs(Math.sin(t * 3)) * gs * 0.25;
      k.face(App.dt); k.pose(gx, 0, gs); k.pose(gx, gy - k.bounds.maxY, gs);
      g.fillStyle = 'rgba(43,45,66,0.14)'; g.beginPath(); g.ellipse(gx, fy + 3, gs * 0.8, gs * 0.14, 0, 0, TAU); g.fill();
      k.draw(g); drawNameTag(g, App.waiting.name, gx, k.bounds.minY - 14, 13);
    }
    if (doomed) {
      const c = doomed.c, x = c.x, y = c.bounds.minY - 34, k = ease.back(clamp01(doomed.t * 5));
      g.save(); g.translate(x, y); g.scale(k, k);
      g.fillStyle = 'rgba(43,45,66,0.18)'; g.beginPath(); g.arc(0, 3, 24, 0, TAU); g.fill();
      g.fillStyle = '#FF5A4E'; g.beginPath(); g.arc(0, 0, 24, 0, TAU); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 4; g.lineCap = 'round';
      g.beginPath(); g.moveTo(-8, -8); g.lineTo(8, 8); g.moveTo(8, -8); g.lineTo(-8, 8); g.stroke();
      g.restore();
    }
    App.fx.draw(g, false);
  }

  return { enter, exit, step, draw, down, move, up, resize: () => root && layout() };
})();

// ---------- Guide: the picture book of things to try (the guide/ folder next to this file) ----------
const Guide = (() => {
  const SRC = 'guide/index.html';
  let root = null, frame, found = null, opener;
  const waiting = [];
  // only offer the book when it is really there
  function probe(btn) {
    btn.style.display = 'none';
    if (found === true) { btn.style.display = ''; return; }
    waiting.push(btn);
    if (found === null) {
      found = false;
      const im = new Image();
      im.onload = () => { found = true; waiting.forEach((b) => (b.style.display = '')); };
      im.src = 'guide/media/cover.jpg';
    }
  }
  function open() {
    if (!root) {
      root = el('div', 'overlay book', App.ui);
      root.setAttribute('role', 'dialog'); root.setAttribute('aria-label', 'Picture guide'); root.setAttribute('aria-modal', 'true');
      frame = el('iframe', 'bookframe', root);
      frame.setAttribute('title', 'Picture guide');
      iconBtn('close', 'ghost bookclose', root, 'Close', close);
      root.addEventListener('click', (e) => { if (e.target === root) close(); });
    }
    opener = document.activeElement;
    if (!frame.getAttribute('src')) frame.src = SRC;
    root.classList.add('on');
    root.querySelector('button').focus();
    frame.contentWindow.postMessage('doodlings:resume-guide', '*');
  }
  function close() { Sound.sfx('tap'); root.classList.remove('on'); if (opener) opener.focus(); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && root?.classList.contains('on')) close(); });
  window.addEventListener('message', e => { if (frame && e.source === frame.contentWindow && e.data === 'doodlings:close-guide') close(); });
  return { open, probe };
})();

// ---------- App: screens, input, storage, main loop ----------
const TAKE_HOME = null; // portable creature payload
const App = {
  W: 0, H: 0, dpr: 1, now: 0, dt: 0.016, screen: null, ui: null, cv: null, g: null,
  fx: new Particles(), list: [], muted: false, cache: new Map(), paperCv: null,
  guests: [], waiting: null,                            // visitors: other people's doodlings, kept apart from the child's own and never changed here

  load() {
    try {
      const s = JSON.parse(localStorage.getItem('doodlings.v1') || 'null');
      if (s && Array.isArray(s.list)) { this.list = s.list.map(cleanCreature).filter(Boolean); this.muted = !!s.muted; }
    } catch (e) { /* storage unavailable: play without saving */ }
    try {
      const v = JSON.parse(localStorage.getItem('doodlings.guests.v1') || 'null');
      if (Array.isArray(v)) this.guests = v.map(cleanCreature).filter((x) => x && x.outline).slice(0, 12);
      this.guests.forEach((x) => { x.guest = true; x.awake = true; });
    } catch (e) { /* no visitors remembered */ }
  },
  // a visitor has arrived by link: remember it (newest first), separately from the child's own doodlings
  hostGuest(gd) {
    gd.guest = true; gd.awake = true; gd.pals = [];
    this.guests = [gd, ...this.guests.filter((x) => x.id !== gd.id)].slice(0, 12);
    this.saveGuests();
    return gd;
  },
  sendHome(id) { this.guests = this.guests.filter((x) => x.id !== id); this.saveGuests(); },
  saveGuests() { try { localStorage.setItem('doodlings.guests.v1', JSON.stringify(this.guests)); } catch (e) { /* ignore */ } },
  save() {
    try {
      const list = this.list.map((d) => ({ ...d, parts: d.parts.map((p) => ({ k: p.k, x: +p.x.toFixed(4), y: +p.y.toFixed(4), s: +(p.s || 1).toFixed(3), r: +(p.r || 0).toFixed(3), c: p.c || null })), outline: d.outline ? d.outline.map((v) => +v.toFixed(4)) : null, paint: d.paint.map((s) => ({ c: s.c, w: s.w, p: s.p.map((v) => +v.toFixed(4)) })) }));
      localStorage.setItem('doodlings.v1', JSON.stringify({ list, muted: this.muted }));
      if (this.storageNotice) this.storageNotice.hidden = true;
    } catch (e) {
      if (!this.storageNotice && this.ui) {
        this.storageNotice = el('div', 'storage-notice', this.ui);
        this.storageNotice.setAttribute('role', 'status');
        this.storageNotice.textContent = 'This browser cannot save. Before leaving, use the camera, then save a playable copy.';
      }
      if (this.storageNotice) this.storageNotice.hidden = false;
    }
  },
  // remember a creature (newest first)
  keep(c) {
    const i = this.list.findIndex((d) => d.id === c.d.id);
    if (i >= 0) this.list.splice(i, 1);
    this.list.unshift(c.d);
    this.cache.set(c.d.id, c);
    this.save();
  },
  // save shortly after a change, so a stray reload or back-swipe never loses a half-made doodling
  keepSoon(c) {
    clearTimeout(this.keepTimer);
    this.pending = c;
    this.keepTimer = setTimeout(() => this.flush(), 1200);
  },
  flush() {
    clearTimeout(this.keepTimer);
    const c = this.pending; this.pending = null;
    if (c && c.d.outline) this.keep(c);
  },
  remove(id) { this.list = this.list.filter((d) => d.id !== id); this.cache.delete(id); this.save(); },
  critterFor(d) {
    let c = this.cache.get(d.id);
    if (!c || c.d !== d) { c = new Critter(d); this.cache.set(d.id, c); }
    return c;
  },

  go(name, args = {}) {
    const next = { home: Home, studio: Studio, world: World, quest: Quest, fair: Fair }[name];
    if (this.screen) this.screen.exit();
    this.flush();
    this.fx.clear();
    this.screen = next;
    next.enter(args);
  },

  paper(g) {
    const W = this.W, H = this.H;
    if (!this.paperCv || this.paperCv.width !== W || this.paperCv.height !== H) {
      const cv = (this.paperCv = document.createElement('canvas')); cv.width = W; cv.height = H;
      const p = cv.getContext('2d');
      p.fillStyle = '#FBF3E4'; p.fillRect(0, 0, W, H);
      const wash = (x, y, r, col, a) => { const gr = p.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rgba(col, a)); gr.addColorStop(1, rgba(col, 0)); p.fillStyle = gr; p.fillRect(0, 0, W, H); };
      const R = Math.max(W, H);
      wash(W * 0.08, H * 0.05, R * 0.55, '#FFC928', 0.2);
      wash(W * 0.95, H * 0.12, R * 0.5, '#FF6FB5', 0.13);
      wash(W * 0.85, H * 1.0, R * 0.6, '#35B6F2', 0.14);
      wash(W * 0.05, H * 0.95, R * 0.45, '#9BD93A', 0.12);
    }
    g.drawImage(this.paperCv, 0, 0);
  },

  resize() {
    const cv = this.cv;
    this.W = Math.max(280, window.innerWidth); this.H = Math.max(320, window.innerHeight);
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(this.W * this.dpr); cv.height = Math.round(this.H * this.dpr);
    cv.style.width = this.W + 'px'; cv.style.height = this.H + 'px';
    if (this.screen && this.screen.resize) this.screen.resize();
  },

  init() {
    this.cv = document.getElementById('cv'); this.g = this.cv.getContext('2d');
    this.ui = document.getElementById('ui');
    this.load();
    Sound.setMuted(this.muted);
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 250));

    const soundBtn = iconBtn(this.muted ? 'soundOff' : 'soundOn', 'ghost corner', this.ui, 'Sound', () => {
      this.muted = !this.muted; Sound.setMuted(this.muted); setIcon(soundBtn, this.muted ? 'soundOff' : 'soundOn');
      if (!this.muted) Sound.sfx('tap');
      this.save();
    });

    // one finger at a time: extra touches (palms, little siblings) are ignored
    let pid = null;
    const pt = (e) => ({ x: e.clientX, y: e.clientY });
    const cv = this.cv;
    cv.addEventListener('pointerdown', (e) => {
      Sound.unlock();
      if (pid !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
      pid = e.pointerId;
      try { cv.setPointerCapture(pid); } catch (_) {}
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      this.screen.down(pt(e));
      e.preventDefault();
    });
    cv.addEventListener('pointermove', (e) => { if (pid === null ? e.pointerType === 'mouse' : e.pointerId === pid) this.screen.move(pt(e)); });
    const end = (e) => { if (e.pointerId !== pid) return; pid = null; this.screen.up(pt(e)); };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    for (const ev of ['contextmenu', 'gesturestart', 'dblclick']) document.addEventListener(ev, (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => { if (e.target === cv) e.preventDefault(); }, { passive: false });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { this.flush(); this.save(); } });
    window.addEventListener('pagehide', () => { this.flush(); this.save(); });
    // some browsers only let sound start from a finished tap
    for (const ev of ['pointerup', 'touchend', 'click', 'keydown']) document.addEventListener(ev, () => Sound.unlock(), { passive: true });

    // a doodling arriving by link or QR code
    let start = null;
    const carried = cleanCreature(TAKE_HOME);
    if (carried && carried.outline) {
      start = this.critterFor(this.list.find(x => x.id === carried.id) || carried);
      this.keep(start);
    }
    const m = /[#&]d=([\w-]+)/.exec(location.hash);
    if (m) {
      const d = Codec.decode(m[1]);
      if (d && d.outline) {
        const same = this.list.find((x) => x.id === d.id);
        start = this.critterFor(same || d);
        if (!same) this.keep(start);
      }
      try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
    }
    // a visitor: it comes to play beside the newest doodling that lives here. Nobody home yet? It waits until one is woken.
    const v = /[#&]v=([\w-]+)/.exec(location.hash);
    let guest = null;
    if (v) {
      const gd = Codec.decode(v[1]);
      if (gd && gd.outline) guest = this.hostGuest(gd);
      try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
    }
    const host = guest && this.list.find((x) => x.outline && x.awake);
    if (host) this.go('world', { critter: this.critterFor(host), from: 'home', guest });
    else if (start && start.d.awake) this.go('world', { critter: start, from: 'home' });
    else if (start) this.go('studio', { critter: start });
    else { this.waiting = guest; this.go('home'); }

    // hosted copies keep working without a connection after the first visit
    if (!TAKE_HOME && /^https?:$/.test(location.protocol) && 'serviceWorker' in navigator) {
      // only where the helper file really sits beside this page (a copy hosted on its own has none)
      fetch('./sw.js', { method: 'HEAD' }).then((r) => { if (r.ok && /javascript/.test(r.headers.get('content-type') || '')) return navigator.serviceWorker.register('./sw.js'); }).catch(() => {});
    }
    let last = performance.now();
    const frame = (ts) => {
      const dt = Math.min(0.05, Math.max(0.001, (ts - last) / 1000));
      last = ts;
      if (!this.manual) this.tick(dt);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  },

  // one frame of the whole experience
  tick(dt) {
    this.dt = dt; this.now += dt;
    const g = this.g;
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    try {
      this.screen.step(dt);
      this.fx.step(dt);
      this.screen.draw(g);
      this.bad = 0;
    } catch (e) {                                          // never let one bad frame freeze a child's screen
      if (!this.bad) console.error(e);
      this.cv.width = this.cv.width;                       // also clears any half-finished drawing state
      if (++this.bad > 30) { this.bad = 0; try { this.go('home'); } catch (_) {} }
    }
  },
};

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(typeof r === 'number' ? r : (r && r[0]) || 0, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}
App.init();

// ===== hooks.js =====
// ---------- hooks for the automated tests and the picture-guide recorder (never used during play) ----------
// step time by hand, so every recorded frame is exactly one tick
window.__doodClock = (dt) => { App.manual = true; if (dt) App.tick(dt); };
window.__doodBeat = (beat, bar) => World._beat(beat, bar);
// the older play-throughs and the guide recorder follow a script: a doodling offering to grow a look in the middle would stop them
window.__doodMoments = (on) => { Moment.hold = !on; };
window.__doodStudio = () => Studio._peek();
window.__doodArt = {
  // one snack, drawn the way the snack drawer draws it
  snack(k, px) {
    const cv = document.createElement('canvas'); cv.width = cv.height = px;
    const g = cv.getContext('2d');
    g.translate(px / 2, px / 2); g.scale(px * 0.4, px * 0.4);
    Snacks[k](g, { t: 0, lw: 3.2 / (px * 0.4) * (px / 120) });
    return cv.toDataURL('image/png');
  },
  // one part, drawn the way its button draws it
  part(k, px, body) {
    const cv = document.createElement('canvas'); cv.width = cv.height = px;
    const g = cv.getContext('2d'); g.scale(px / 60, px / 60);
    drawPartThumb(g, k, 60, body || PALETTE[0]);
    return cv.toDataURL('image/png');
  },
  // the three ability icons, a cup or ribbon, and a ticket
  qual(i, px) { const cv = document.createElement('canvas'); cv.width = cv.height = px; drawQual(cv.getContext('2d'), i, px / 2, px / 2, px * 0.42); return cv.toDataURL('image/png'); },
  trophy(m, px) { const cv = document.createElement('canvas'); cv.width = cv.height = px; drawTrophy(cv.getContext('2d'), px / 2, px / 2, px * 0.44, m); return cv.toDataURL('image/png'); },
  ticket(px) { const cv = document.createElement('canvas'); cv.width = cv.height = px; drawTicket(cv.getContext('2d'), px / 2, px / 2, px * 0.38); return cv.toDataURL('image/png'); },
  // the pictures on the voice and band buttons
  voice(k, px) { const cv = document.createElement('canvas'); cv.width = cv.height = px; drawVoiceThumb(cv.getContext('2d'), k, px); return cv.toDataURL('image/png'); },
  tune(k, px) { const cv = document.createElement('canvas'); cv.width = cv.height = px; drawTuneThumb(cv.getContext('2d'), k, px); return cv.toDataURL('image/png'); },
  wordmark(h, color) {
    const cv = document.createElement('canvas'); cv.width = Math.round(h * 6); cv.height = Math.round(h * 2.15);
    drawWordmark(cv.getContext('2d'), cv.width / 2, h * 0.86, h, { x: 0.25, y: 0.2 }, false, color || INK);
    return cv.toDataURL('image/png');
  },
  // a group picture: items = [{ seed | id, wear, x, y, S, mood, talk, ang, lookX, lookY }]
  photo(items, W, H) {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    for (const it of items) {
      let c;
      if (it.id) { const d = App.list.find((x) => x.id === it.id) || App.list[0]; c = new Critter({ ...d, parts: d.parts.map((p) => ({ ...p })) }); }
      else c = makeDemo(it.seed, it.wear);
      c.alive = true; c.ang = it.ang || 0; c.talk = it.talk || 0; c.lookX = it.lookX || 0; c.lookY = it.lookY || 0;
      if (it.mood) { c.mood = it.mood; c.moodT = 9; }
      c.pose(it.x, 0, it.S);
      c.pose(it.x, it.y - c.bounds.maxY, it.S);
      c.drawShadow(g, it.y);
      c.draw(g);
    }
    return cv.toDataURL('image/png');
  },
};

// the drawing internals, for contact sheets (tools/look.mjs)
window.__doodKit = { App, Places, PARTS, PART_TRAYS, PLACE_LIST, QUESTS, PONDS, VOICE_LIST, TUNE_LIST, drawPartThumb, makeDemo, Critter, worldTheme, PALETTE,
  Shape, Snacks, newCreatureData, partTint, shade, inkOf, Grow, GrowHud, Codec, Cup, Shoot, Fair, LOOKS, PRIZES, CUPS, QUALS, SHOOT };

})();
