<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doodlings</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBF3E4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 8c14 0 24 8 24 22S48 58 32 58 6 46 8 30 18 8 32 8z' fill='%2335B6F2' stroke='%23174a78' stroke-width='4'/%3E%3Ccircle cx='24' cy='28' r='7' fill='%23fff' stroke='%232B2D42' stroke-width='3'/%3E%3Ccircle cx='41' cy='28' r='7' fill='%23fff' stroke='%232B2D42' stroke-width='3'/%3E%3Ccircle cx='25' cy='29' r='3' fill='%232B2D42'/%3E%3Ccircle cx='42' cy='29' r='3' fill='%232B2D42'/%3E%3Cpath d='M24 42q8 7 16 0' fill='none' stroke='%232B2D42' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --ink: #2B2D42; --paper: #FBF3E4; --card: #FFFDF8; --sun: #FFC928; --coral: #FF5A4E;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --btn: 58px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink);
  font-family: "SF Pro Rounded", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; touch-action: none; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui button, #ui input, .tray, .drawer .panel, .overlay { pointer-events: auto; }

/* ----- buttons ----- */
.btn { width: var(--btn); height: var(--btn); border: 0; border-radius: 50%; padding: 0; flex: none; cursor: pointer;
  display: grid; place-items: center; color: var(--ink); background: var(--card);
  box-shadow: 0 4px 0 rgba(43,45,66,.16), 0 10px 22px rgba(43,45,66,.14), inset 0 -3px 0 rgba(43,45,66,.05);
  transition: transform .16s cubic-bezier(.3,1.6,.5,1), box-shadow .16s, background .2s, color .2s; outline: none; }
.btn svg { width: 52%; height: 52%; display: block; }
.btn:active { transform: translateY(4px) scale(.94); box-shadow: 0 0 0 rgba(43,45,66,.16), 0 3px 8px rgba(43,45,66,.14); }
.btn:focus-visible { box-shadow: 0 0 0 4px rgba(53,182,242,.6), 0 4px 0 rgba(43,45,66,.16); }
.btn.sm { --btn: 46px; }
.btn.ghost { background: rgba(255,253,248,.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); --btn: 50px; }
.btn.primary { background: var(--sun); --btn: 64px; box-shadow: 0 5px 0 #D99A00, 0 12px 24px rgba(217,154,0,.35), inset 0 3px 0 rgba(255,255,255,.45); }
.btn.primary:active { box-shadow: 0 0 0 #D99A00, 0 3px 8px rgba(217,154,0,.3); }
.btn.huge { --btn: 92px; }
.btn.on { background: var(--ink); color: #fff; }
.btn.dim { opacity: .4; }
.btn.glow { animation: glow 1.4s ease-in-out infinite; }
.btn.pulse { animation: pulse 1.5s ease-in-out infinite; }
.btn.corner { position: absolute; top: calc(12px + var(--sat)); right: 12px; --btn: 44px; z-index: 30; }
.btn.rec { color: var(--coral); --btn: 58px; }
.btn.rec.on { background: var(--coral); color: #fff; animation: pulse 1s ease-in-out infinite; }
@keyframes glow { 0%,100% { box-shadow: 0 5px 0 #D99A00, 0 0 0 0 rgba(255,201,40,.7); } 50% { box-shadow: 0 5px 0 #D99A00, 0 0 0 16px rgba(255,201,40,0); transform: scale(1.07); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
@keyframes wiggle { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px) rotate(-3deg); } 40% { transform: translateX(7px) rotate(3deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
@keyframes pop { 0% { transform: scale(.3); } 55% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes rise { from { transform: translateY(26px); opacity: 0; } to { transform: none; opacity: 1; } }
.wiggle { animation: wiggle .4s ease; }
.pop { animation: pop .5s cubic-bezier(.3,1.5,.5,1); }

/* ----- screens ----- */
.screen { position: absolute; inset: 0; display: none; }
.screen.on { display: block; }
.topbar { position: absolute; top: calc(12px + var(--sat)); left: 12px; right: 68px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.steps { margin: 0 auto; display: flex; gap: 6px; padding: 6px; border-radius: 99px; background: rgba(255,253,248,.86); box-shadow: 0 8px 22px rgba(43,45,66,.12); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.btn.step { --btn: 48px; box-shadow: none; background: transparent; }
.btn.step.on { background: var(--ink); color: #fff; }
.topbar .primary { --btn: 58px; }

/* ----- studio tray ----- */
.tray { position: absolute; left: 50%; bottom: calc(12px + var(--sab)); transform: translateX(-50%); width: min(720px, calc(100% - 20px));
  background: rgba(255,253,248,.94); border-radius: 30px; padding: 12px; box-shadow: 0 14px 40px rgba(43,45,66,.18);
  display: flex; flex-direction: column; gap: 10px; animation: rise .35s cubic-bezier(.2,1.2,.4,1); }
.row { display: none; align-items: center; justify-content: center; gap: 10px; min-width: 0; }
.row.on, .row.palette, .cardbox .row { display: flex; }
.row.tools, .row.parts { height: 78px; }
.row.palette { gap: 7px; flex-wrap: wrap; }
.swatch { width: 38px; height: 38px; border-radius: 46% 54% 52% 48% / 55% 48% 52% 45%; border: 0; padding: 0; background: var(--c); cursor: pointer; flex: none;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.14), inset 0 3px 0 rgba(255,255,255,.35), 0 2px 5px rgba(43,45,66,.2); transition: transform .18s cubic-bezier(.3,1.6,.5,1); }
.swatch.on { transform: scale(1.22); box-shadow: inset 0 -4px 0 rgba(0,0,0,.14), inset 0 3px 0 rgba(255,255,255,.35), 0 0 0 3px var(--card), 0 0 0 6px var(--ink); }
.btn.size i { display: block; border-radius: 50%; background: currentColor; }
.row.parts { justify-content: flex-start; gap: 8px; }
.cats { display: flex; gap: 5px; padding: 4px; border-radius: 99px; background: rgba(43,45,66,.07); flex: none; }
.btn.cat { --btn: 42px; box-shadow: none; background: transparent; }
.btn.cat.on { background: var(--ink); color: #fff; }
.thumbs { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 4px 2px 8px; flex: 1; min-width: 0; touch-action: pan-x; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.thumbs::-webkit-scrollbar { display: none; }
.thumb { flex: none; width: 66px; height: 66px; border-radius: 20px; border: 0; padding: 0; background: #fff; cursor: pointer; display: grid; place-items: center; touch-action: pan-x;
  box-shadow: 0 3px 0 rgba(43,45,66,.13), 0 6px 14px rgba(43,45,66,.1); transition: transform .16s cubic-bezier(.3,1.6,.5,1); }
.thumb:active { transform: scale(.9); }
.thumb canvas { pointer-events: none; display: block; grid-area: 1 / 1; }

/* ----- world ----- */
.dock { position: absolute; left: 50%; bottom: calc(14px + var(--sab)); transform: translateX(-50%); display: flex; gap: 12px; padding: 10px; border-radius: 99px;
  background: rgba(255,253,248,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 12px 30px rgba(43,45,66,.16); transition: transform .5s cubic-bezier(.3,1.3,.5,1), opacity .3s; }
.drawer { position: absolute; left: 0; right: 0; bottom: calc(104px + var(--sab)); display: flex; justify-content: center; pointer-events: none; }
.panel { display: none; gap: 10px; padding: 12px; border-radius: 28px; background: rgba(255,253,248,.92); box-shadow: 0 14px 34px rgba(43,45,66,.18); animation: rise .28s cubic-bezier(.2,1.3,.4,1); max-width: calc(100% - 20px); }
.panel.on { display: grid; }
.panel.snacks { grid-template-columns: repeat(8, auto); }
.panel.tricks { grid-template-columns: repeat(5, auto); align-items: center; }
.thumb.snack, .thumb.slot { touch-action: none; }
.thumb.slot.empty { background: transparent; box-shadow: inset 0 0 0 3px rgba(43,45,66,.16); border-radius: 50%; }
.thumb.slot.empty::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: rgba(43,45,66,.16); grid-area: 1 / 1; place-self: center; }
.waking .dock, .waking .drawer, .waking .topbar { transform: translate(-50%, 160%); opacity: 0; pointer-events: none; }
.waking .topbar { transform: translateY(-160%); }

/* ----- home ----- */
.home .huge { position: absolute; left: 50%; bottom: calc(7vh + var(--sab)); margin-left: -46px; }

.shelfnav { position: absolute; top: 64%; }
.shelfnav.left { left: 12px; }
.shelfnav.right { right: 12px; }

.home .bookbtn { position: absolute; top: calc(12px + var(--sat)); left: 12px; }
.overlay.book { z-index: 50; }
.bookframe { width: min(96vw, 620px); height: min(94vh, 960px); border: 0; border-radius: 26px; background: #FBF3E4; box-shadow: 0 24px 60px rgba(0,0,0,.4); }
.bookclose { position: absolute; top: calc(10px + var(--sat)); right: 10px; }

/* ----- keepsake card ----- */
.overlay { position: absolute; inset: 0; display: none; place-items: center; background: rgba(36,30,70,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 40; }
.overlay.on { display: grid; }
.cardbox { display: flex; flex-direction: column; align-items: center; gap: 12px; animation: pop .45s cubic-bezier(.3,1.4,.5,1); }
canvas.card { height: min(62vh, 108vw); aspect-ratio: 3 / 4; border-radius: 4.4% / 3.3%; box-shadow: 0 24px 60px rgba(0,0,0,.35); transform: rotate(-1.5deg); }
input.name { width: min(300px, 70vw); height: 52px; border: 0; border-radius: 99px; text-align: center; font-family: inherit; font-size: 26px; font-weight: 800; color: var(--ink); background: var(--card);
  box-shadow: 0 4px 0 rgba(43,45,66,.16), 0 10px 22px rgba(43,45,66,.2); outline: none; -webkit-user-select: text; user-select: text; }
input.name::placeholder { color: rgba(43,45,66,.35); }
input.name:focus { box-shadow: 0 0 0 4px var(--sun), 0 10px 22px rgba(43,45,66,.2); }
.qrwrap { position: absolute; inset: 0; display: none; place-items: center; background: rgba(36,30,70,.8); z-index: 5; cursor: pointer; }
.qrwrap.on { display: grid; }
.qrwrap canvas { width: min(84vw, 84vh, 620px); height: auto; border-radius: 28px; box-shadow: 0 24px 60px rgba(0,0,0,.4); animation: pop .4s cubic-bezier(.3,1.4,.5,1); image-rendering: pixelated; }

/* ----- small screens ----- */
@media (max-width: 520px) {
  :root { --btn: 52px; }
  .dock { gap: 8px; padding: 8px; }
  .panel.snacks { grid-template-columns: repeat(4, auto); }
  .thumb { width: 60px; height: 60px; }
  .swatch { width: 34px; height: 34px; }
  .tray { padding: 10px; border-radius: 26px; }
  .drawer { bottom: calc(92px + var(--sab)); }
}
@media (max-width: 380px) {
  .topbar { left: 8px; right: 58px; gap: 4px; }
  .btn.ghost { --btn: 42px; }
  .btn.step { --btn: 40px; }
  .steps { gap: 3px; padding: 4px; }
  .topbar .primary { --btn: 50px; }
  .btn.corner { right: 8px; --btn: 42px; }
  .dock { gap: 6px; padding: 6px; --btn: 48px; }
  .dock .btn { --btn: 48px; }
  .panel { gap: 6px; padding: 8px; }
  .thumb { width: 54px; height: 54px; border-radius: 17px; }
  .thumb canvas { transform: scale(.86); }
  .btn.rec { --btn: 48px; }
  .panel.tricks .thumb { width: 48px; height: 48px; }
  .panel.tricks .thumb canvas { transform: scale(.78); }
  .cats { gap: 2px; padding: 3px; }
  .btn.cat { --btn: 36px; }
  .row.tools, .row.parts { height: 66px; }
  .swatch { width: 30px; height: 30px; }
}
@media (max-height: 520px) and (min-width: 600px) {
  .tray { flex-direction: row; align-items: center; width: min(900px, calc(100% - 20px)); padding: 8px 12px; }
  .row.palette { flex-wrap: nowrap; overflow-x: auto; }
  .swatch { width: 30px; height: 30px; }
}
@media (prefers-reduced-motion: reduce) { .btn.glow, .btn.pulse, .btn.rec.on { animation: none; } }

/* ----- world: places, friends, the trail button ----- */
.topbar .gap { flex: 1; pointer-events: none; }
.topbar .trail { --btn: 54px; }
.panel.places, .panel.pals { grid-auto-flow: column; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; scrollbar-width: none; }
.panel.places::-webkit-scrollbar, .panel.pals::-webkit-scrollbar { display: none; }
.thumb.scene { --sw: 87px; width: calc(var(--sw) + 8px); height: calc(var(--sw) / 1.5 + 8px); padding: 4px; overflow: hidden; }
.thumb.scene canvas { width: var(--sw) !important; height: calc(var(--sw) / 1.5) !important; transform: none; border-radius: 15px; }
.thumb.scene.on, .thumb.pal.on, .thumb.voice.on, .thumb.tune.on { box-shadow: 0 0 0 3px var(--card), 0 0 0 6px var(--ink); }
.panel.tunes { grid-template-columns: repeat(5, auto); }
.thumb.voice, .thumb.tune { background: transparent; box-shadow: none; }
.thumb.pal { background: #FFF6DF; }
.storage-notice { position: absolute; top: calc(70px + var(--sat)); left: 50%; transform: translateX(-50%); width: min(90vw, 440px); padding: 12px 16px; background: #FFF4CD; color: var(--ink);
  border-radius: 18px; box-shadow: 0 0 0 2px #D99A00, 0 10px 22px rgba(43,45,66,.14); font-size: 14px; font-weight: 700; z-index: 60; text-align: center; pointer-events: auto; }
.storage-notice[hidden] { display: none; }

/* ----- the adventure trail ----- */
.questbar { position: absolute; left: 50%; bottom: calc(14px + var(--sab)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 34px; max-width: calc(100% - 16px);
  background: rgba(255,253,248,.92); box-shadow: 0 14px 34px rgba(43,45,66,.18); transition: transform .45s cubic-bezier(.3,1.3,.5,1), opacity .3s; pointer-events: auto; }
.questbar .snacks { display: grid; grid-template-columns: repeat(8, auto); gap: 8px; }
.questbar .btn.go { --btn: 76px; }
.questbar .thumb.snack.idle { animation: nudge 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * .12s); }
@keyframes nudge { 0%, 14%, 100% { transform: none; } 7% { transform: translateY(-9px); } }
.questbar .hops { display: none; grid-template-columns: repeat(6, auto); gap: 8px; }
.questbar.math .hops { display: grid; }
.questbar.math .snacks { display: none; }
.thumb.hop[hidden] { display: none; }
.quest .worldbtn { --btn: 54px; }
.quest:not(.map) .worldbtn { display: none; }
.quest.map .questbar, .quest.run .questbar { transform: translate(-50%, 170%); opacity: 0; pointer-events: none; }
.quest.map .questbar *, .quest.run .questbar * { pointer-events: none; }

@media (max-width: 900px) { .thumb.scene { --sw: 72px; } }
@media (max-width: 760px) {
  .panel.places { grid-auto-flow: row; grid-template-columns: repeat(4, auto); overflow: visible; }
  .thumb.scene { --sw: 87px; }
}
@media (max-width: 720px) {
  .questbar .snacks { grid-template-columns: repeat(4, auto); }
}
@media (max-width: 520px) {
  .questbar .hops { grid-template-columns: repeat(3, auto); gap: 6px; }
  .dock .btn { --btn: 50px; }
  .questbar { gap: 8px; padding: 9px; border-radius: 28px; }
  .questbar .snacks { gap: 6px; }
  .questbar .btn.go { --btn: 64px; }
  .thumb.scene { --sw: 70px; }
  .topbar .trail { --btn: 50px; }
}
@media (max-width: 380px) {
  .dock .btn { --btn: 46px; }
  .topbar .trail { --btn: 44px; }
  .questbar .btn.go { --btn: 54px; }
  .thumb.scene { --sw: 58px; }
}
@media (max-height: 520px) and (min-width: 600px) {
  .questbar .snacks { grid-template-columns: repeat(8, auto); }
  .questbar { padding: 8px 12px; }
  .panel.places { grid-auto-flow: column; grid-template-columns: none; overflow-x: auto; overflow-y: hidden; }
  .thumb.scene { --sw: 60px; }
}

/* ----- the name tag (the one place words appear: the child's own) ----- */
input.tag { position: absolute; top: calc(74px + var(--sat)); left: 50%; margin-left: calc(min(190px, 50vw) / -2); width: min(190px, 50vw); height: 38px; border: 0; border-radius: 99px; text-align: center;
  font-family: inherit; font-size: 20px; font-weight: 800; color: var(--ink); background: rgba(255,253,248,.82); outline: none; -webkit-user-select: text; user-select: text;
  box-shadow: 0 3px 0 rgba(43,45,66,.12), 0 6px 14px rgba(43,45,66,.12); transition: opacity .3s, transform .3s; }
input.tag::placeholder { color: rgba(43,45,66,.4); }
input.tag:focus { box-shadow: 0 0 0 4px var(--sun), 0 6px 14px rgba(43,45,66,.12); background: var(--card); }
input.tag:placeholder-shown:not(:focus) { width: 46px; margin-left: -23px; }
input.tag.pulse { animation: pulse 1.5s ease-in-out infinite; box-shadow: 0 0 0 4px var(--sun), 0 6px 14px rgba(43,45,66,.12); }
.waking input.tag { opacity: 0; pointer-events: none; transform: translateY(-40px); }

/* ----- the fair ----- */
.shootbar { position: absolute; left: 0; right: 0; bottom: calc(16px + var(--sab)); height: 0; display: none; }
.shootbar.on { display: block; }
.shootbar .btn { position: absolute; bottom: 0; }
.shootbar .btn:nth-child(1) { left: 16px; }
.shootbar .btn:nth-child(2) { left: 50%; margin-left: -34px; --btn: 68px; display: none; }
.shootbar.done .btn:nth-child(2) { display: grid; }
.shootbar .btn:nth-child(3) { right: 16px; }
.cupbar { position: absolute; left: 0; right: 0; margin: 0 auto; width: -webkit-fit-content; width: fit-content; bottom: calc(14px + var(--sab)); display: none; align-items: center; gap: 12px; padding: 10px; border-radius: 34px;
  background: rgba(255,253,248,.92); box-shadow: 0 14px 34px rgba(43,45,66,.18); pointer-events: auto; animation: rise .3s cubic-bezier(.2,1.3,.4,1); }
.cupbar[data-phase="line"], .cupbar[data-phase="podium"] { display: flex; }
.cupbar .packs { display: flex; gap: 8px; }
.cupbar[data-phase="podium"] .packs, .cupbar[data-phase="podium"] .go, .cupbar[data-phase="line"] > .btn:not(.go) { display: none; }
.cupbar .btn.go { --btn: 68px; }
.thumb.pack { touch-action: manipulation; }
.thumb.pack.on { box-shadow: 0 0 0 3px var(--card), 0 0 0 7px var(--q); }
.panel.prizes { position: absolute; left: 0; right: 0; margin: 0 auto; width: -webkit-fit-content; width: fit-content; bottom: calc(14px + var(--sab)); grid-template-columns: repeat(5, auto); }
.thumb.prize { width: 72px; height: 72px; }
.thumb.prize.on, .thumb.lookthumb.on { box-shadow: 0 0 0 3px var(--card), 0 0 0 6px var(--ink); }
.thumb.prize.far { background: rgba(255,255,255,.6); }
.thumb.prize.far canvas { opacity: .7; }
.thumb.won { background: #FFF4CD; }
.thumb.pal.guest { background: #E6F4FF; }
@media (min-width: 880px) { .panel.prizes { grid-template-columns: repeat(10, auto); } }
@media (max-width: 520px) { .thumb.prize { width: 64px; height: 64px; } .thumb.prize canvas { transform: scale(.9); } .cupbar { gap: 8px; padding: 8px; } .cupbar .btn.go { --btn: 60px; } }
@media (max-width: 380px) { .thumb.prize { width: 58px; height: 58px; } .thumb.prize canvas { transform: scale(.82); } .cupbar .packs { gap: 5px; } }

/* ----- the growing moment ----- */
.overlay.moment { z-index: 45; }
.lookpick { display: flex; gap: 18px; align-items: center; animation: pop .5s cubic-bezier(.3,1.4,.5,1); }
.thumb.look { width: auto; height: auto; padding: 10px; border-radius: 30px; background: var(--card); box-shadow: 0 6px 0 rgba(43,45,66,.2), 0 18px 40px rgba(0,0,0,.3); touch-action: manipulation; }
.thumb.look.new { animation: lookglow 1.5s ease-in-out infinite; }
@keyframes lookglow { 0%,100% { box-shadow: 0 0 0 5px var(--sun), 0 0 0 0 rgba(255,201,40,.7), 0 18px 40px rgba(0,0,0,.3); } 50% { box-shadow: 0 0 0 5px var(--sun), 0 0 0 18px rgba(255,201,40,0), 0 18px 40px rgba(0,0,0,.3); transform: scale(1.04); } }
@media (max-width: 380px) { .lookpick { gap: 10px; } .thumb.look { padding: 6px; border-radius: 22px; } }

/* ----- the keepsake card: which code is showing ----- */
.qrkind { position: absolute; top: calc(18px + var(--sat)); left: 50%; margin-left: -32px; width: 64px; height: 64px; border-radius: 50%; background: var(--sun); color: var(--ink); display: grid; place-items: center; box-shadow: 0 5px 0 #D99A00; }
.qrkind svg { width: 56%; height: 56%; }
/* six buttons along the top of the play screen: keep them clear of the sound button on a phone */
@media (max-width: 520px) { .topbar { gap: 6px; } .btn.ghost { --btn: 44px; } .topbar .trail { --btn: 48px; } }
@media (max-width: 380px) { .topbar { gap: 4px; } .btn.ghost { --btn: 40px; } .topbar .trail { --btn: 42px; } }
/* the making screen on an upright phone: the kinds of part get a row of their own, so the parts have the whole width */
@media (max-width: 520px) and (min-height: 521px) {
  .row.parts { flex-wrap: wrap; height: auto; row-gap: 6px; }
  .row.parts .cats { margin: 0 auto; }
  .row.parts .thumbs { flex: 0 0 100%; }
}
@media (max-height: 520px) and (min-width: 600px) {
  .panel.prizes { grid-template-columns: repeat(10, auto); gap: 6px; padding: 8px; }
  .thumb.prize { width: 58px; height: 58px; } .thumb.prize canvas { transform: scale(.82); }

    // "radius": halfway between the equal-area circle and the farthest reach, so long thin doodles are not shown tiny
    const r = 0.5 * Math.sqrt(Math.abs(a) / Math.PI) + 0.5 * far;
    return { cx: cx0, cy: cy0, r, far, area: Math.abs(a), minX, minY, maxX, maxY };
  }

  function contains(o, x, y) {
    let inside = false;
    for (let i = 0, n = o.length, j = n - 2; i < n; j = i, i += 2) {
      if ((o[i + 1] > y) !== (o[j + 1] > y) && x < ((o[j] - o[i]) * (y - o[i + 1])) / (o[j + 1] - o[i + 1]) + o[i]) inside = !inside;
    }
    return inside;
  }

  // distance from (x, y) along direction (dx, dy) to the farthest crossing of the outline
  function edgeAt(o, x, y, dx, dy) {
    let far = 0;
    for (let i = 0, n = o.length; i < n; i += 2) {
      const j = (i + 2) % n, ex = o[j] - o[i], ey = o[j + 1] - o[i + 1];
      const den = dx * ey - dy * ex;
      if (Math.abs(den) < 1e-9) continue;
      const t = ((o[i] - x) * ey - (o[i + 1] - y) * ex) / den;
      const u = ((o[i] - x) * dy - (o[i + 1] - y) * dx) / den;
      if (t > 0 && u >= 0 && u <= 1 && t > far) far = t;
    }
    return far;
  }

  // scale an outline about its centroid (used to keep very small doodles workable)
  function scaled(o, k) {
    const m = metrics(o), out = new Array(o.length);
    // keep the result inside the square
    const lim = Math.min(k, 0.47 / Math.max(m.cx - m.minX, m.maxX - m.cx, m.cy - m.minY, m.maxY - m.cy, 1e-6) );
    for (let i = 0; i < o.length; i += 2) {
      out[i] = m.cx + (o[i] - m.cx) * lim;
      out[i + 1] = m.cy + (o[i + 1] - m.cy) * lim;
    }
    return out;
  }

  // a friendly random blob (dice button, demo creatures)
  function random(rnd = Math.random) {
    const base = 0.2 + rnd() * 0.05, tall = 0.85 + rnd() * 0.4;
    const h = [];
    for (let k = 2; k <= 5; k++) h.push([k, (rnd() * 0.16) / (k - 1), rnd() * TAU]);
    const lump = rnd() < 0.5 ? [rnd() < 0.5 ? 2 : 3, 0.08 + rnd() * 0.08, rnd() * TAU] : null;
    const o = new Array(N * 2);
    for (let i = 0; i < N; i++) {
      const a = (i / N) * TAU;
      let r = 1;
      for (const [k, amp, ph] of h) r += amp * Math.sin(k * a + ph);
      if (lump) r += lump[1] * Math.max(0, Math.sin(lump[0] * a + lump[2])) ** 2 * 2;
      o[i * 2] = 0.5 + Math.cos(a) * r * base / Math.sqrt(tall);
      o[i * 2 + 1] = 0.52 + Math.sin(a) * r * base * Math.sqrt(tall);
    }
    return o;
  }

  return { N, merge, metrics, contains, edgeAt, scaled, random, isLoop, pathLength };
})();

// ===== parts-face.js =====
// ---------- face parts: eyes and mouths (they are alive: blink, look, talk, show moods) ----------
// draw(g, o): same contract as the parts in src/parts/ (see src/parts/README.md), plus
//   o.open 0..1 eyelids, o.lookX / o.lookY -1..1 gaze, o.mood, o.talk 0..1 mouth opening, o.body creature colour
const MOUTH_IN = '#7B2142', TONGUE = '#FF7E9D';

function _eye(g, o, cfg) {
  const rx = cfg.rx, ry = cfg.ry, mood = o.mood, lw = o.lw;
  g.save();
  g.lineJoin = g.lineCap = 'round';
  g.strokeStyle = INK;
  g.lineWidth = lw * 1.15;
  const lashes = (closed) => {
    if (!cfg.lash) return;
    g.lineWidth = lw * 0.9;
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI * (0.62 + i * 0.13), r0 = closed ? 0.82 : 1, r1 = closed ? 1.25 : 1.42;
      const yk = closed ? -0.25 : 1;
      g.beginPath();
      g.moveTo(Math.cos(a) * rx * r0, Math.sin(a) * ry * r0 * yk);
      g.lineTo(Math.cos(a - 0.12) * rx * r1, Math.sin(a - 0.12) * ry * r1 * yk);
      g.stroke();
    }
  };
  if (mood === 'happy' || mood === 'proud') {            // ^ ^
    g.beginPath(); g.moveTo(-rx * 0.82, ry * 0.22); g.quadraticCurveTo(0, -ry * 1.0, rx * 0.82, ry * 0.22); g.stroke();
    g.restore(); return;
  }
  if (mood === 'sleep' || o.open < 0.16) {               // closed
    g.beginPath(); g.moveTo(-rx * 0.82, -ry * 0.02); g.quadraticCurveTo(0, ry * 0.62, rx * 0.82, -ry * 0.02); g.stroke();
    lashes(true);
    g.restore(); return;
  }
  if (mood === 'sour') {                                  // > <
    g.beginPath(); g.moveTo(-rx * 0.6, -ry * 0.55); g.lineTo(rx * 0.45, 0); g.lineTo(-rx * 0.6, ry * 0.55); g.stroke();
    g.restore(); return;
  }
  const squish = o.open < 1 ? Math.max(o.open, 0.16) : 1;
  g.scale(1, squish);
  g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, TAU);
  g.fillStyle = '#fff'; g.fill();
  g.save();
  g.clip();
  if (mood === 'dizzy') {                                 // spiral
    g.lineWidth = lw * 0.9;
    g.beginPath();
    const spin = o.t * 7;
    for (let i = 0; i <= 40; i++) {
      const a = (i / 40) * TAU * 2.2 + spin, r = (i / 40) * Math.min(rx, ry) * 0.82;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    }
    g.stroke();
  } else {
    const small = mood === 'wide' || mood === 'frozen' || mood === 'hot';
    const p = cfg.pupil * (small ? 0.6 : 1);
    const px = o.lookX * (rx - p) * 0.8, py = o.lookY * (ry - p) * 0.8;
    if (cfg.iris) {
      g.beginPath(); g.arc(px * 0.8, py * 0.8, cfg.pupil * 1.75, 0, TAU);
      g.fillStyle = o.fill; g.fill();
      g.lineWidth = lw * 0.5; g.strokeStyle = o.ink; g.stroke();
    }
    g.beginPath(); g.ellipse(px, py, p * (cfg.px || 1), p, 0, 0, TAU);
    g.fillStyle = INK; g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(px - p * 0.34, py - p * 0.38, p * 0.36, 0, TAU); g.fill();
    g.beginPath(); g.arc(px + p * 0.36, py + p * 0.34, p * 0.15, 0, TAU); g.fill();
    if (mood === 'frozen') { g.fillStyle = 'rgba(140,215,255,0.35)'; g.fillRect(-1, -1, 2, 2); }
  }
  if (cfg.lid) {                                          // heavy eyelid in the creature's own colour
    const y = -ry + ry * 2 * cfg.lid;
    g.fillStyle = o.body; g.fillRect(-rx - 0.1, -ry - 0.1, rx * 2 + 0.2, y + ry + 0.1);
    g.strokeStyle = INK; g.lineWidth = lw; g.beginPath(); g.moveTo(-rx, y); g.lineTo(rx, y); g.stroke();
  }
  g.restore();
  g.strokeStyle = INK; g.lineWidth = lw * 1.15;
  g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, TAU); g.stroke();
  lashes(false);
  g.restore();
}

// shared mood shapes for mouths; returns true when it drew the mouth
function _mouthMood(g, o) {
  const m = o.mood, lw = o.lw;
  g.lineJoin = g.lineCap = 'round'; g.strokeStyle = INK; g.lineWidth = lw * 1.15;
  if (m === 'wide' || m === 'o') {
    g.beginPath(); g.ellipse(0, 0.12, 0.13 + o.talk * 0.06, 0.16 + o.talk * 0.1, 0, 0, TAU);
    g.fillStyle = MOUTH_IN; g.fill(); g.stroke(); return true;
  }
  if (m === 'sour' || m === 'dizzy' || m === 'frozen') {
    const amp = m === 'frozen' ? 0.07 : 0.06, n = m === 'frozen' ? 5 : 3, ph = m === 'sour' ? 0 : o.t * (m === 'frozen' ? 30 : 5);
    g.beginPath();
    for (let i = 0; i <= 24; i++) {
      const x = -0.34 + (i / 24) * 0.68, y = 0.1 + Math.sin((i / 24) * Math.PI * n + ph) * amp;
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    }
    g.stroke(); return true;
  }
  if (m === 'sleep') {
    if (o.talk > 0.1) { g.beginPath(); g.ellipse(0, 0.1, 0.08 + o.talk * 0.05, 0.08 + o.talk * 0.09, 0, 0, TAU); g.fillStyle = MOUTH_IN; g.fill(); g.stroke(); }
    else { g.beginPath(); g.moveTo(-0.14, 0.08); g.quadraticCurveTo(0, 0.16, 0.14, 0.08); g.stroke(); }
    return true;
  }
  return false;
}

// an open, laughing mouth: used by several styles. amt 0..1
function _mouthOpen(g, o, w, amt, opts = {}) {
  const top = opts.top === undefined ? 0.04 : opts.top, deep = 0.26 + amt * 0.62;
  const lips = new Path2D();
  lips.moveTo(-w, 0);
  lips.quadraticCurveTo(0, top, w, 0);
  lips.bezierCurveTo(w * 0.92, deep * 0.9, w * 0.5, deep, 0, deep);
  lips.bezierCurveTo(-w * 0.5, deep, -w * 0.92, deep * 0.9, -w, 0);
  lips.closePath();
  g.fillStyle = MOUTH_IN; g.fill(lips);
  g.save(); g.clip(lips);
  g.fillStyle = TONGUE;
  g.beginPath(); g.ellipse(0, deep + 0.02, w * 0.58, deep * 0.42, 0, 0, TAU); g.fill();
  if (opts.teeth) { g.fillStyle = '#fff'; g.fillRect(-w, -0.1, w * 2, 0.1 + 0.11 + amt * 0.04); }
  if (opts.fangs) {
    g.fillStyle = '#fff';
    for (const s of [-1, 1]) {
      g.beginPath(); g.moveTo(s * w * 0.62, -0.02); g.lineTo(s * w * 0.3, -0.02);
      g.quadraticCurveTo(s * w * 0.42, 0.24, s * w * 0.5, 0.2); g.closePath(); g.fill();
    }
  }
  g.restore();
  g.strokeStyle = INK; g.lineWidth = o.lw * 1.15; g.stroke(lips);
}

// ===== parts/_helpers.js =====
// ---------- parts: the helpers every part file uses ----------
// Each part lives in its own file in this folder. How a part is drawn is explained in src/parts/README.md.
// These files are joined in alphabetical order after this one (see tools/build.mjs).
const PartsExtra = {};

// Path strings are turned into shapes once and kept, so nothing new is built while the toy is animating.
const _pxPaths = new Map();
function _pxPath(d) {
  if (!_pxPaths.has(d)) _pxPaths.set(d, new Path2D(d));
  return _pxPaths.get(d);
}

// Fill and/or outline a shape. d is a path string ('M0 0 L1 1 ...') or a Path2D. Pass null to skip the fill or the outline.
function _pxShape(g, d, fill, stroke) {
  const p = typeof d === 'string' ? _pxPath(d) : d;
  if (fill) { g.fillStyle = fill; g.fill(p); }
  if (stroke) { g.strokeStyle = stroke; g.stroke(p); }
}

// A circle at (x, y) with radius r.
function _pxDot(g, x, y, r, fill, stroke) {
  g.beginPath(); g.arc(x, y, r, 0, TAU);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.stroke(); }
}

// A thin detail line (a seam, a crease) in the outline colour.
function _pxLine(g, d, o) {
  g.lineWidth = o.lw * .55;
  _pxShape(g, d, null, o.ink);
  g.lineWidth = o.lw;
}

// Makes one part from its settings and its paint(g, o) function.
// It sets the outline thickness and round corners first, and puts the canvas back the way it was afterwards.
function _pxPart(def) {
  const { paint, ...settings } = def;
  return {
    ...settings,
    draw(g, o) {
      g.save();
      try { g.lineWidth = o.lw; g.lineCap = g.lineJoin = 'round'; paint(g, o); } finally { g.restore(); }
    },
  };
}

// The same wrapper for a snack.
function _pxSnack(paint) {
  return function (g, o) {
    g.save();
    try { g.lineWidth = o.lw; g.lineCap = g.lineJoin = 'round'; paint(g, o); } finally { g.restore(); }
  };
}

// ===== particles.js =====
// ---------- particles ----------
class Particles {
  constructor() { this.list = []; }
  clear() { this.list.length = 0; }

  // kind: spark | star | confetti | puff | flame | heart | note | zzz | shard | ring | bubble | dot
  emit(kind, x, y, o = {}) {
    if (this.list.length > 520) this.list.splice(0, 40);
    const p = {
      kind, x, y,
      vx: o.vx || 0, vy: o.vy || 0,
      life: o.life || 1, age: 0,
      size: o.size || 10,
      color: o.color || '#fff',
      rot: o.rot === undefined ? rand(TAU) : o.rot, vr: o.vr === undefined ? rand(-4, 4) : o.vr,
      g: o.g || 0, drag: o.drag || 0,
      back: !!o.back, seed: Math.random(),
    };
    this.list.push(p);
    return p;
  }

  burst(kind, x, y, n, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = o.angle === undefined ? rand(TAU) : o.angle + rand(-(o.spread || 0.5), o.spread || 0.5);
      const sp = rand(o.speed ? o.speed * 0.35 : 60, o.speed || 220);
      this.emit(kind, x + rand(-(o.jitter || 0), o.jitter || 0), y + rand(-(o.jitter || 0), o.jitter || 0), {
        ...o,
        vx: Math.cos(a) * sp + (o.vx || 0), vy: Math.sin(a) * sp + (o.vy || 0),
        life: (o.life || 1) * rand(0.6, 1.1),
        size: (o.size || 10) * rand(0.6, 1.2),
        color: o.colors ? pick(o.colors) : o.color,
      });
    }
  }

  step(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.age += dt;
      if (p.age >= p.life) { L[i] = L[L.length - 1]; L.pop(); continue; }
      p.vy += p.g * dt;
      if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
      if (p.kind === 'confetti') p.vx += Math.sin(p.age * 9 + p.seed * 30) * 260 * dt;
      if (p.kind === 'note' || p.kind === 'zzz' || p.kind === 'heart' || p.kind === 'bubble') p.x += Math.sin(p.age * 3.5 + p.seed * 9) * 22 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
  }

  draw(g, back) {
    for (const p of this.list) {
      if (p.back !== back) continue;
      const k = p.age / p.life, s = p.size;
      g.save();
      g.translate(p.x, p.y);
      switch (p.kind) {
        case 'spark': {
          g.globalAlpha = (1 - k) ** 1.5;
          g.fillStyle = p.color;
          g.beginPath(); g.arc(0, 0, s * (1 - k * 0.6), 0, TAU); g.fill();
          break;
        }
        case 'dot': {
          g.globalAlpha = 1 - k * k;
          g.fillStyle = p.color;
          g.beginPath(); g.arc(0, 0, s, 0, TAU); g.fill();
          break;
        }
        case 'star': {
          const a = Math.sin(Math.min(1, k * 1.15) * Math.PI);
          g.globalAlpha = a; g.rotate(p.rot); g.fillStyle = p.color;
          const r = s * (0.5 + a * 0.5);
          g.beginPath();
          for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * 0.28 : r, an = (i / 8) * TAU; g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
          g.closePath(); g.fill();
          break;
        }
        case 'confetti': {
          g.globalAlpha = k > 0.8 ? (1 - k) * 5 : 1;
          g.rotate(p.rot); g.scale(1, Math.cos(p.age * 10 + p.seed * 20));
          g.fillStyle = p.color;
          g.beginPath(); g.roundRect(-s * 0.5, -s * 0.3, s, s * 0.6, s * 0.15); g.fill();
          break;
        }
        case 'puff': {
          g.globalAlpha = (1 - k) * 0.75;
          g.fillStyle = p.color;
          g.beginPath(); g.arc(0, 0, s * (0.5 + ease.out(k) * 0.9), 0, TAU); g.fill();
          break;
        }
        case 'flame': {
          const r = s * (1 - k * 0.75);
          g.globalAlpha = 1 - k ** 3;
          g.fillStyle = k < 0.25 ? '#FFF2A8' : k < 0.55 ? '#FFC928' : k < 0.8 ? '#FF9433' : '#FF5A4E';
          g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
          break;
        }
        case 'heart': {
          const a = k < 0.15 ? k / 0.15 : 1 - smoothstep(0.6, 1, k);
          g.globalAlpha = a; g.scale(s / 10 * (0.6 + ease.back(Math.min(1, k * 4)) * 0.4), s / 10 * (0.6 + ease.back(Math.min(1, k * 4)) * 0.4));
          g.rotate(Math.sin(p.age * 3 + p.seed * 9) * 0.25);
          g.fillStyle = p.color;
          g.beginPath(); g.moveTo(0, 8); g.bezierCurveTo(-14, -2, -8, -12, 0, -5); g.bezierCurveTo(8, -12, 14, -2, 0, 8); g.fill();
          break;
        }
        case 'note': {
          g.globalAlpha = k < 0.1 ? k * 10 : 1 - smoothstep(0.6, 1, k);
          g.scale(s / 10, s / 10); g.rotate(Math.sin(p.age * 4 + p.seed * 9) * 0.3);
          g.fillStyle = g.strokeStyle = p.color; g.lineWidth = 2.4; g.lineCap = 'round';
          g.beginPath(); g.ellipse(-3, 6, 4.4, 3.4, -0.4, 0, TAU); g.fill();
          g.beginPath(); g.moveTo(1, 5); g.lineTo(1, -9); g.quadraticCurveTo(6, -8, 8, -3); g.stroke();
          break;
        }
        case 'zzz': {
          g.globalAlpha = (k < 0.15 ? k / 0.15 : 1 - smoothstep(0.6, 1, k)) * 0.9;
          g.scale(s / 10 * (0.6 + k * 0.7), s / 10 * (0.6 + k * 0.7));
          g.strokeStyle = p.color; g.lineWidth = 2.6; g.lineCap = g.lineJoin = 'round';
          g.beginPath(); g.moveTo(-5, -5); g.lineTo(5, -5); g.lineTo(-5, 5); g.lineTo(5, 5); g.stroke();
          break;
        }
        case 'shard': {
          g.globalAlpha = 1 - k * k; g.rotate(p.rot);
          g.fillStyle = p.color;
          g.beginPath(); g.moveTo(-s * 0.5, s * 0.4); g.lineTo(0, -s * 0.6); g.lineTo(s * 0.5, s * 0.3); g.closePath(); g.fill();
          g.fillStyle = 'rgba(255,255,255,0.6)';
          g.beginPath(); g.moveTo(-s * 0.2, s * 0.2); g.lineTo(0, -s * 0.4); g.lineTo(s * 0.1, s * 0.1); g.closePath(); g.fill();
          break;
        }
        case 'ring': {
          g.globalAlpha = (1 - k) * 0.9;
          g.strokeStyle = p.color; g.lineWidth = Math.max(1, s * 0.12 * (1 - k));
          g.beginPath(); g.arc(0, 0, s * ease.out(k), 0, TAU); g.stroke();
          break;
        }
        case 'bubble': {
          g.globalAlpha = 1 - k ** 4;
          g.strokeStyle = p.color; g.lineWidth = 2;
          g.beginPath(); g.arc(0, 0, s, 0, TAU); g.stroke();
          g.fillStyle = 'rgba(255,255,255,0.7)'; g.beginPath(); g.arc(-s * 0.35, -s * 0.35, s * 0.2, 0, TAU); g.fill();
          break;
        }
      }
      g.restore();
    }
  }
}

// ===== creature.js =====
// ---------- the creature: data, squishy body, face, drawing ----------
const PARTS = Object.assign({}, PartsFace, PartsExtra);
const PART_TRAYS = {
  eyes: Object.keys(PARTS).filter((k) => PARTS[k].kind === 'eye'),
  mouths: Object.keys(PARTS).filter((k) => PARTS[k].kind === 'mouth'),
  bits: ['earRound', 'earPoint', 'earLong', 'horn', 'antenna', 'arm', 'foot', 'mitten', 'skate', 'wing', 'tail', 'tentacle', 'tuft', 'puff', 'braid', 'ponytail', 'spike', 'cape', 'stick', 'balloon'],
  wear: ['hat', 'toque', 'cap', 'crown', 'helmet', 'patka', 'headscarf', 'earmuffs', 'headphones', 'scarf', 'bow', 'glasses', 'flower', 'nose', 'mustache', 'cheek', 'star', 'heart', 'patch', 'freckles'],
};
// how it talks, and the band that plays for its show
const VOICE_LIST = ['chirp', 'squeak', 'rumble', 'bubble', 'robot', 'kazoo'];
const TUNE_LIST = ['pop', 'funk', 'chip', 'beach', 'dream'];
// prizes are won at the fair: they join a doodling's own tray once it owns them (see studio.js)
for (const k in PARTS) if (!PARTS[k].kind && !PARTS[k].prize && !PART_TRAYS.bits.includes(k) && !PART_TRAYS.wear.includes(k)) PART_TRAYS[PARTS[k].layer === 'back' ? 'bits' : 'wear'].push(k);
const MAX_PARTS = 28;

function newCreatureData() {
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: '', color: PALETTE[5], outline: null,
    paint: [], parts: [], tricks: [],
    place: 'meadow', pals: [], voice: 'chirp', tune: 'pop',
    awake: false, seed: (Math.random() * 1e9) | 0, born: Date.now(),
    grow: null, best: {}, guest: false,                // what play has made of it (grow.js), the child's best rounds, and whether it is only visiting
  };
}

// Saved data and links come from outside: accept only creatures that can actually be drawn, and tidy the rest.
function cleanCreature(d) {
  if (!d || typeof d !== 'object') return null;
  const nums = (a) => Array.isArray(a) && a.every((v) => typeof v === 'number' && Number.isFinite(v));
  if (d.outline != null) {
    const o = d.outline;
    if (!nums(o) || o.length < 16 || o.length % 2) return null;
    const m = Shape.metrics(o);
    if (!(m.r > 0.01) || !(m.area > 1e-5) || !Number.isFinite(m.cx + m.cy + m.r)) return null;
  } else d.outline = null;
  if (typeof d.id !== 'string' || !d.id) return null;
  if (typeof d.color !== 'string' || !/^#[0-9a-f]{6}$/i.test(d.color)) d.color = PALETTE[5];
  d.name = typeof d.name === 'string' ? d.name.slice(0, 14) : '';
  d.seed = Number.isFinite(d.seed) ? d.seed >>> 0 : 1;
  d.awake = !!d.awake && !!d.outline;
  d.parts = (Array.isArray(d.parts) ? d.parts : []).filter((p) => p && PARTS[p.k] && Number.isFinite(p.x) && Number.isFinite(p.y)).slice(0, MAX_PARTS)
    .map((p) => ({ k: p.k, x: clamp(p.x, -0.1, 1.1), y: clamp(p.y, -0.1, 1.1), s: clamp(Number.isFinite(p.s) ? p.s : 1, 0.4, 3.2), r: Number.isFinite(p.r) ? p.r : 0, c: typeof p.c === 'string' && /^#[0-9a-f]{6}$/i.test(p.c) ? p.c : null }));
  d.paint = (Array.isArray(d.paint) ? d.paint : []).filter((s) => s && nums(s.p) && s.p.length >= 2 && s.p.length % 2 === 0 && Number.isFinite(s.w) && typeof s.c === 'string').slice(-500);
  d.place = typeof d.place === 'string' && Places.has(d.place) ? d.place : 'meadow';
  d.voice = VOICE_LIST.includes(d.voice) ? d.voice : 'chirp';
  d.tune = TUNE_LIST.includes(d.tune) ? d.tune : 'pop';
  d.pals = (Array.isArray(d.pals) ? d.pals : []).filter((s) => typeof s === 'string' && s.length < 40).slice(0, 3);
  d.tricks = (Array.isArray(d.tricks) ? d.tricks : []).filter((t) => t && nums(t.p) && t.p.length >= 6 && t.p.length % 3 === 0).slice(0, 4);
  Grow.clean(d);
  return d;
}

// where the next one of a part goes when it is tapped on: its next slot, measured out to the edge of this body
// (the studio and the prize counter both use this)
function partSlot(c, key) {
  const d = c.d, m = c.m, def = PARTS[key], count = d.parts.filter((p) => p.k === key).length;
  if (key === 'glasses' || key === 'shades') {
    const eyes = d.parts.filter((p) => PARTS[p.k] && PARTS[p.k].kind === 'eye');
    if (eyes.length && !count) return { x: eyes.reduce((a, p) => a + p.x, 0) / eyes.length, y: eyes.reduce((a, p) => a + p.y, 0) / eyes.length, r: 0 };
  }
  const [deg, dist] = def.slots[count % def.slots.length];
  const a = (deg * Math.PI) / 180, dx = Math.sin(a), dy = -Math.cos(a);
  const e = Shape.edgeAt(d.outline, m.cx, m.cy, dx, dy) || m.r;
  const lap = Math.floor(count / def.slots.length), j = lap ? 0.04 * lap : 0;
  return { x: m.cx + dx * e * dist + j, y: m.cy + dy * e * dist + j, r: def.orient ? a : 0 };
}

function partTint(def, body) {
  const t = def.tint;
  if (!t || t === 'body') return body;
  if (t === 'bodyDark') return shade(body, -0.22);
  if (t === 'bodyLight') return shade(body, 0.3);
  return t;
}

class Critter {
  constructor(d) {
    this.d = d;
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.ang = 0; this.av = 0;
    this.q = 0; this.qv = 0; this.qT = 0;            // squash (+ tall, - flat)
    this.sc = 1; this.scv = 0; this.scT = 1;          // size spring (snacks change scT)
    this.baseS = 100;                                  // px per body unit at sc = 1
    this.puff = 0;
    this.grounded = false; this.airT = 1; this.grab = null; this.kin = null;
    this.alive = !!d.awake; this.asleep = false;
    this.mood = 'idle'; this.moodT = 0;
    this.open = 1; this.blinkT = rand(1, 3); this.blink = 0;
    this.lookX = 0; this.lookY = 0; this.lookAt = null; this.wanderT = 0; this.wx = 0; this.wy = 0;
    this.talk = 0; this.talkT = 0; this.sayT = 0; this.mouthHold = 0;
    this.fx = {};
    this.t = rand(100);
    this.ax_ = 0; this.ay_ = 0;                        // smoothed body acceleration (for dangly parts)
    this.pvx = 0; this.pvy = 0; this.pav = 0;
    this.swing = []; this.gp = [];                     // gp: the crest of a grown look (never part of what the child placed)
    this.paintCv = null; this.paintDirty = true; this.paintRect = null;
    this.colorCache = new Map();
    this.onLand = null; this.onWall = null;
    this.bounds = { minX: 0, minY: 0, maxX: 0, maxY: 0 };
    if (d.outline) this.setOutline(d.outline);
  }

  get S() { return this.baseS * this.sc; }
  get outlinePx() { return clamp(this.baseS * 0.05, 2.5, 8) * Math.min(1.5, Math.max(0.7, this.sc)); }

  setOutline(o) {
    this.d.outline = o;
    const m = (this.m = Shape.metrics(o)), n = (this.n = o.length / 2);
    this.rx = new Float32Array(n); this.ry = new Float32Array(n);
    this.cxr = new Float32Array(n); this.cyr = new Float32Array(n);   // puffed-up (round) version
    this.lag = new Float32Array(n);
    this.unit = new Array(n * 2);
    let far = 0, avg = 0;
    this.ub = { x0: (m.minX - m.cx) / m.r, y0: (m.minY - m.cy) / m.r, x1: (m.maxX - m.cx) / m.r, y1: (m.maxY - m.cy) / m.r };   // the box the body fits in, in body units
    this.ub.w = this.ub.x1 - this.ub.x0; this.ub.h = this.ub.y1 - this.ub.y0; this.ub.cx = (this.ub.x0 + this.ub.x1) / 2;
    for (let i = 0; i < n; i++) {
      const ux = (o[i * 2] - m.cx) / m.r, uy = (o[i * 2 + 1] - m.cy) / m.r;
      this.rx[i] = ux; this.ry[i] = uy; this.unit[i * 2] = ux; this.unit[i * 2 + 1] = uy;
      const d = hypot(ux, uy); far = Math.max(far, d); avg += d / n;
    }
    for (let i = 0; i < n; i++) {
      const d = hypot(this.rx[i], this.ry[i]) || 1;
      this.cxr[i] = (this.rx[i] / d) * (avg * 0.75 + d * 0.25) * 1.08;
      this.cyr[i] = (this.ry[i] / d) * (avg * 0.75 + d * 0.25) * 1.08;
      this.lag[i] = 0.45 + 0.75 * (d / far) ** 2;
    }
    this.far = far;
    for (const k of ['ox', 'oy', 'ovx', 'ovy', 'ax', 'ay', 'rotx', 'roty']) if (!this[k] || this[k].length !== n) this[k] = new Float32Array(n);
    this.paintDirty = true;
    this.refreshParts();
  }

  // ----- coordinates -----
  toUnit(sx, sy) { return [(sx - this.m.cx) / this.m.r, (sy - this.m.cy) / this.m.r]; }

  // ----- simulation -----
  step(dt, env) {

  // ----- drawing -----
  bodyColor() {

  colors(fill) {

    g.strokeStyle = rgba(ink, 0.13); g.lineWidth = ol * 3.4; g.lineJoin = 'round'; g.stroke(path);
    if (this.fx.ice) {
      g.fillStyle = 'rgba(205,240,255,0.3)'; g.fillRect(b.minX, b.minY, w, h);
      g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = ol * 0.9; g.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const x = b.minX + w * (0.25 + i * 0.2), y = b.minY + h * (0.22 + (i % 2) * 0.12);
        g.beginPath(); g.moveTo(x, y + h * 0.16); g.lineTo(x + w * 0.1, y); g.stroke();
      }
    }
    g.restore();

    g.strokeStyle = ink;
    g.lineWidth = ol; g.lineJoin = 'round';
    g.stroke(path);

    // head coverings sit under the face, so eyes and smiles are never hidden
    for (let i = 0; i < parts.length; i++) if (PARTS[parts[i].k] && PARTS[parts[i].k].under) this.drawPart(g, i);
    for (let i = 0; i < parts.length; i++) if (PARTS[parts[i].k] && PARTS[parts[i].k].layer !== 'back' && !PARTS[parts[i].k].under) this.drawPart(g, i);
  }

  // soft contact shadow on the ground
  drawShadow(g, floorY) {
    const b = this.bounds, w = b.maxX - b.minX, lift = clamp01((floorY - b.maxY) / (this.S * 3));
    g.save();
    g.fillStyle = `rgba(30,25,60,${0.2 * (1 - lift * 0.75)})`;
    g.beginPath(); g.ellipse((b.minX + b.maxX) / 2, floorY + this.S * 0.03, Math.max(0.1, w * 0.5 * (1 - lift * 0.45)), Math.max(0.1, this.S * 0.1 * (1 - lift * 0.4)), 0, 0, TAU); g.fill();
    g.restore();
  }

  // place at rest with no motion (studio, cards, thumbnails): cx, cy = where the body centre goes
  pose(cx, cy, S) {
    this.x = cx; this.y = cy; this.baseS = S;
    this.vx = this.vy = this.av = 0; this.pvx = this.pvy = this.pav = 0;
    this.sub(0, null);
  }
}

// a taught trick's shape, drawn as a ribbon: the icon children recognise it by
function drawTrickGlyph(g, trick, cx, cy, size, color) {
  const p = trick.p, n = p.length / 3;
  if (n < 2) return;
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for (let i = 0; i < n; i++) { minX = Math.min(minX, p[i * 3]); maxX = Math.max(maxX, p[i * 3]); minY = Math.min(minY, p[i * 3 + 1]); maxY = Math.max(maxY, p[i * 3 + 1]); }
  const k = size / Math.max(maxX - minX, maxY - minY, 0.6), mx = (minX + maxX) / 2, my = (minY + maxY) / 2;
  const X = (i) => cx + (p[i * 3] - mx) * k, Y = (i) => cy + (p[i * 3 + 1] - my) * k;
  g.save();
  g.lineCap = g.lineJoin = 'round';
  const trace = () => { g.beginPath(); g.moveTo(X(0), Y(0)); for (let i = 1; i < n; i++) g.lineTo(X(i), Y(i)); };
  trace(); g.strokeStyle = inkOf(color); g.lineWidth = size * 0.2; g.stroke();
  trace(); g.strokeStyle = color; g.lineWidth = size * 0.11; g.stroke();
  g.fillStyle = '#fff'; g.strokeStyle = inkOf(color); g.lineWidth = size * 0.045;
  g.beginPath(); g.arc(X(0), Y(0), size * 0.085, 0, TAU); g.fill(); g.stroke();
  g.fillStyle = color;
  g.beginPath(); g.arc(X(n - 1), Y(n - 1), size * 0.115, 0, TAU); g.fill(); g.stroke();
  g.restore();
}

// ===== grow.js =====
// ---------- Grow: what a doodling becomes through play. Abilities, meals, looks, tickets and prizes ----------
// Playing grows the doodling. Growing never changes the child's own games: nothing in shoot.js reads any of this.
// The whole design, and why each number is what it is, is written up in THE-FAIR.md.

// The three abilities. Each has five pips. The colour is how a child tells them apart.
const QUALS = [
  { k: 'hop', col: '#FF9433' },      // jumping: clean hurdles
  { k: 'steady', col: '#35B6F2' },   // balance: beams, and getting up after a stumble
  { k: 'puff', col: '#FF5A4E' },     // breath: hills, and something left for the finish
];
const WILD = '#8E5CF2';
const LEVEL_XP = [2, 6, 12, 20, 30];   // points needed for each pip
// what each snack feeds: 0 hop, 1 steady, 2 puff, 3 wild (goes to whichever ability is furthest behind)
const SNACK_FEEDS = { jelly: 0, gum: 0, ice: 1, pea: 1, pepper: 2, star: 2, rainbow: 3, mushroom: 3 };
// what each kind of play practises: [hop, steady, puff]
const PRACTICE = { shoot: [0, 2, 1], keep: [2, 1, 0], trail: [1, 0, 2], pond: [0, 2, 1], trick: [2, 0, 0], show: [1, 0, 1], goal: [0, 1, 0], cup: [1, 1, 1] };

// The looks a doodling can grow into, and the foods that lead there (two foods in balance give the rarer ones).
// The position in this list is what gets saved: only ever add to the end.
const LOOKS = [null,
  { k: 'coil', from: [0], crest: [['gCoil', 128, 1]] },
  { k: 'ember', from: [2], crest: [['gEmber', 0, 0.98]] },
  { k: 'frost', from: [1], crest: [['gFrost', 0, 0.98]] },
  { k: 'party', from: [3], crest: [['gParty', 0, 0.98]] },
  { k: 'comet', from: [0, 2], crest: [['gComet', -122, 1]] },
  { k: 'marble', from: [1, 2], crest: [['gMarble', 0, 1]] },
  { k: 'bubble', from: [0, 1], crest: [['gBubble', 0, 1]] },
];
const LOOK_AT = [2, 5, 8, 11, 14];     // pips in total at which a doodling can grow a look

// The prize counter. part = something to wear (drawn in src/parts/). The position in this list is saved: only add to the end.
const PRIZES = [
  { k: 'partyhat', cost: 3, part: true }, { k: 'whistle', cost: 3, part: true }, { k: 'pompom', cost: 4, part: true }, { k: 'shades', cost: 4, part: true },
  { k: 'bunting', cost: 4 }, { k: 'gloves', cost: 5, part: true }, { k: 'jersey', cost: 5, part: true }, { k: 'foamfinger', cost: 6, part: true },
  { k: 'propeller', cost: 7, part: true }, { k: 'goldframe', cost: 8 },
];

const Grow = (() => {
  const blank = () => ({ xp: [0, 0, 0], diet: [0, 0, 0, 0], eat: {}, fed: [], seen: [], looks: [], look: 0, stage: 0, tickets: 0, own: [], off: [], cups: [0, 0, 0] });
  const of = (d) => d.grow || (d.grow = blank());
  const level = (xp) => LEVEL_XP.filter((t) => xp >= t).length;
  const levels = (d) => of(d).xp.map(level);
  const total = (d) => levels(d).reduce((a, b) => a + b, 0);

  // Saved data and links come from outside: keep only what makes sense.
  function clean(d) {
    const G = d.grow && typeof d.grow === 'object' ? d.grow : {}, B = blank();
    const num = (v, hi) => clamp(Number.isFinite(v) ? v : 0, 0, hi);
    const list = (a, ok) => [...new Set((Array.isArray(a) ? a : []).filter(ok))];
    B.xp = B.xp.map((_, i) => num(G.xp && G.xp[i], 30));
    B.diet = B.diet.map((_, i) => num(G.diet && G.diet[i], 12));
    for (const k in SNACK_FEEDS) { const v = num(G.eat && G.eat[k], 999) | 0; if (v) B.eat[k] = v; }
    B.fed = (Array.isArray(G.fed) ? G.fed : []).filter((k) => k in SNACK_FEEDS).slice(-3);
    B.seen = list(G.seen, (k) => k in SNACK_FEEDS);
    B.looks = list(G.looks, (i) => Number.isInteger(i) && i > 0 && i < LOOKS.length);
    B.look = B.looks.includes(G.look) ? G.look : 0;
    B.stage = num(G.stage, LOOK_AT.length) | 0;
    B.tickets = num(G.tickets, 99) | 0;
    B.own = list(G.own, (k) => PRIZES.some((p) => p.k === k));
    B.off = list(G.off, (k) => B.own.includes(k));
    B.cups = B.cups.map((_, i) => num(G.cups && G.cups[i], 3) | 0);
    d.grow = B;
    const best = {};
    if (d.best && typeof d.best === 'object') for (const k in d.best) if (/^[a-z]+\.[a-z]+\.[1-3]$/.test(k)) best[k] = num(d.best[k], 5) | 0;
    d.best = best;
    d.guest = !!d.guest;
  }

  // the snack it has eaten most (three times at least): it gets extra happy about that one
  function favourite(d) {
    const eat = of(d).eat;
    let fav = '', n = 2;
    for (const k in SNACK_FEEDS) if ((eat[k] || 0) > n) { n = eat[k]; fav = k; }
    return fav;
  }

  // A snack has been eaten. It waits in the tummy until the next thing the doodling finishes.
  function feed(d, k) {
    if (d.guest || !(k in SNACK_FEEDS)) return null;
    const G = of(d), first = !G.seen.includes(k);
    if (first) G.seen.push(k);
    G.eat[k] = Math.min(999, (G.eat[k] || 0) + 1);
    G.diet = G.diet.map((v, i) => Math.min(12, v * 0.88 + (i === SNACK_FEEDS[k] ? 1 : 0)));   // what it has been eating lately
    G.fed.push(k); if (G.fed.length > 3) G.fed.shift();
    return { first, fav: favourite(d) === k };
  }

  // The doodling finished something. Returns what it gained, so the screen can show it.
  // o.bonus: a very good round (one more point). o.tickets: tickets won.
  function earn(d, kind, o = {}) {
    if (d.guest || !PRACTICE[kind]) return null;
    const G = of(d), before = levels(d), gain = PRACTICE[kind].slice();
    if (o.bonus) gain[gain.indexOf(Math.max(...gain))]++;
    const meals = G.fed.splice(0).map((k) => {
      let q = SNACK_FEEDS[k];
      if (q > 2) { const now = G.xp.map((v, i) => v + gain[i]); q = now.indexOf(Math.min(...now)); }
      gain[q]++;
      return { k, q };
    });
    G.xp = G.xp.map((v, i) => Math.min(30, v + gain[i]));
    const tickets = Math.min(99 - G.tickets, o.tickets || 0);
    G.tickets += tickets;
    return { gain, meals, before, after: levels(d), tickets, had: G.tickets - tickets };
  }

  // ----- looks -----
  function nextLook(d) {
    const G = of(d), eaten = G.diet.reduce((a, b) => a + b, 0);
    // the foods it has been eating, most first. Never fed: go by what it has practised most.
    const order = eaten >= 1 ? [0, 1, 2, 3].sort((a, b) => G.diet[b] - G.diet[a]) : [0, 1, 2].sort((a, b) => G.xp[b] - G.xp[a]);
    const [a, b] = order, both = eaten >= 1 && a < 3 && b < 3 && G.diet[b] >= G.diet[a] * 0.6;
    const find = (fams) => LOOKS.findIndex((L) => L && L.from.length === fams.length && fams.every((f) => L.from.includes(f)));
    const tries = [both ? find([a, b]) : 0, find([a]), find([b]), ...LOOKS.map((_, i) => i)];
    return tries.find((i) => i > 0 && !G.looks.includes(i)) || 0;
  }
  // the look it is ready to grow right now (0 = none)
  const pending = (d) => { const G = of(d); return !d.guest && G.stage < LOOK_AT.length && total(d) >= LOOK_AT[G.stage] ? nextLook(d) : 0; };
  // The child has chosen. Either way the look is kept for later; wear = put it on now.
  function settle(d, look, wear) {
    const G = of(d);
    G.stage = Math.min(LOOK_AT.length, G.stage + 1);
    if (look && !G.looks.includes(look)) G.looks.push(look);
    if (look && wear) G.look = look;
  }

  // ----- prizes -----
  const owns = (d, k) => of(d).own.includes(k);
  const shows = (d, k) => owns(d, k) && !of(d).off.includes(k);
  function buy(d, k) {
    const G = of(d), p = PRIZES.find((x) => x.k === k);
    if (!p || d.guest) return 'no';
    if (G.own.includes(k)) return 'own';
    if (G.tickets < p.cost) return 'short';
    G.tickets -= p.cost; G.own.push(k);
    return 'bought';
  }
  function toggle(d, k) { const G = of(d), i = G.off.indexOf(k); if (i >= 0) G.off.splice(i, 1); else G.off.push(k); }

  return { of, clean, level, levels, total, favourite, feed, earn, pending, settle, owns, shows, buy, toggle };
})();

// ---------- the pictures for all of that ----------
// One ability's icon: a spring, a ball balanced on a point, a puff of breath.
function drawQual(g, i, x, y, r, dim) {
  const col = dim ? '#C9C5BC' : QUALS[i].col, ink = dim ? '#8F8A80' : inkOf(col);
  g.save(); g.translate(x, y); g.scale(r, r); g.lineCap = g.lineJoin = 'round';
  if (i === 0) {
    const coil = () => { g.beginPath(); g.moveTo(-0.62, 0.82); g.lineTo(0.62, 0.82); g.moveTo(-0.5, 0.56); g.lineTo(0.5, 0.3); g.lineTo(-0.5, 0.02); g.lineTo(0.5, -0.26); g.lineTo(-0.5, -0.54); g.moveTo(-0.62, -0.8); g.lineTo(0.62, -0.8); };
    coil(); g.strokeStyle = ink; g.lineWidth = 0.46; g.stroke();
    coil(); g.strokeStyle = col; g.lineWidth = 0.24; g.stroke();
  } else if (i === 1) {
    g.lineWidth = 0.14; g.strokeStyle = ink;
    g.fillStyle = col; g.beginPath(); g.moveTo(-0.78, 0.84); g.lineTo(0, -0.02); g.lineTo(0.78, 0.84); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(0, -0.46, 0.42, 0, TAU); g.fill(); g.stroke();
  } else {
    g.lineWidth = 0.14; g.strokeStyle = ink; g.fillStyle = col;
    g.beginPath(); g.moveTo(-0.5, 0.5); g.bezierCurveTo(-1.05, 0.5, -1.0, -0.2, -0.5, -0.16); g.bezierCurveTo(-0.5, -0.78, 0.3, -0.86, 0.42, -0.34); g.bezierCurveTo(1.0, -0.4, 1.05, 0.5, 0.5, 0.5); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 0.12; g.beginPath(); g.arc(-0.05, -0.2, 0.34, 3.5, 4.6); g.stroke();
  }
  g.restore();
}

// what a snack does, as a tiny white mark for its badge
function drawPowerGlyph(g, fx, x, y, r) {
  g.save(); g.translate(x, y); g.scale(r, r); g.lineCap = g.lineJoin = 'round'; g.strokeStyle = g.fillStyle = '#fff'; g.lineWidth = 0.34;
  g.beginPath();
  if (fx === 'fire') { g.moveTo(0, -1); g.bezierCurveTo(0.2, -0.3, 0.9, -0.1, 0.62, 0.55); g.bezierCurveTo(0.4, 1.05, -0.4, 1.05, -0.62, 0.55); g.bezierCurveTo(-0.9, -0.1, -0.2, -0.3, 0, -1); g.fill(); }
  else if (fx === 'glow') { for (let i = 0; i < 10; i++) { const a = (i / 10) * TAU - Math.PI / 2, rr = i % 2 ? 0.42 : 1; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath(); g.fill(); }
  else if (fx === 'float') { g.ellipse(0, -0.3, 0.62, 0.7, 0, 0, TAU); g.fill(); g.beginPath(); g.lineWidth = 0.2; g.moveTo(0, 0.4); g.quadraticCurveTo(0.3, 0.7, 0, 1); g.stroke(); }
  else if (fx === 'giant') { g.moveTo(0, 0.9); g.lineTo(0, -0.8); g.moveTo(-0.6, -0.2); g.lineTo(0, -0.85); g.lineTo(0.6, -0.2); g.stroke(); }
  else if (fx === 'tiny') { g.moveTo(0, -0.9); g.lineTo(0, 0.8); g.moveTo(-0.6, 0.2); g.lineTo(0, 0.85); g.lineTo(0.6, 0.2); g.stroke(); }
  else if (fx === 'rainbow') { g.lineWidth = 0.28; g.arc(0, 0.5, 0.9, Math.PI, 0); g.stroke(); g.beginPath(); g.arc(0, 0.5, 0.42, Math.PI, 0); g.stroke(); }
  else if (fx === 'ice') { g.lineWidth = 0.26; for (let k = 0; k < 3; k++) { const a = (k / 3) * Math.PI + 0.52; g.moveTo(-Math.cos(a), -Math.sin(a)); g.lineTo(Math.cos(a), Math.sin(a)); } g.stroke(); }
  else { g.lineWidth = 0.3; g.moveTo(-0.6, 0.9); g.lineTo(0.6, 0.45); g.lineTo(-0.6, 0); g.lineTo(0.6, -0.45); g.lineTo(-0.6, -0.9); g.stroke(); }
  g.restore();
}

// five pips in a row, the first n of them lit. pop (0..1) makes pip number n - 1 jump as it lights.
function drawPips(g, x, y, n, col, r, gap, pop = 0) {
  for (let i = 0; i < 5; i++) {
    const on = i < n, k = on && i === n - 1 && pop > 0 ? 1 + Math.sin(pop * Math.PI) * 0.9 : 1, px = x + i * gap;
    if (on && i === n - 1 && pop > 0) { g.strokeStyle = rgba(col, 0.7 * pop); g.lineWidth = r * 0.5; g.beginPath(); g.arc(px, y, r * (1 + (1 - pop) * 2.6), 0, TAU); g.stroke(); }
    g.fillStyle = on ? col : 'rgba(43,45,66,0.14)'; g.beginPath(); g.arc(px, y, r * k, 0, TAU); g.fill();
    if (on) { g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.arc(px - r * 0.28, y - r * 0.3, r * 0.3 * k, 0, TAU); g.fill(); }
  }
}

// a fairground ticket
function drawTicket(g, x, y, r, rot = -0.2) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(r, r); g.lineJoin = 'round';
  const p = new Path2D(); p.moveTo(-1, -0.58); p.lineTo(1, -0.58); p.lineTo(1, -0.2); p.arc(1, 0, 0.2, -Math.PI / 2, Math.PI / 2, true); p.lineTo(1, 0.58); p.lineTo(-1, 0.58); p.lineTo(-1, 0.2); p.arc(-1, 0, 0.2, Math.PI / 2, -Math.PI / 2, true); p.closePath();
  g.fillStyle = '#FFC928'; g.fill(p); g.strokeStyle = INK; g.lineWidth = 0.14; g.stroke(p);
  g.strokeStyle = 'rgba(43,45,66,0.35)'; g.lineWidth = 0.08; g.setLineDash([0.12, 0.14]); g.beginPath(); g.moveTo(-0.5, -0.5); g.lineTo(-0.5, 0.5); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#fff'; g.strokeStyle = INK; g.lineWidth = 0.08; g.beginPath();
  for (let i = 0; i < 10; i++) { const a = (i / 10) * TAU - Math.PI / 2, rr = i % 2 ? 0.17 : 0.4; g.lineTo(0.2 + Math.cos(a) * rr, Math.sin(a) * rr); }
  g.closePath(); g.fill(); g.stroke();
  g.restore();
}

const MEDAL_COL = ['#7CC8F2', '#D98B4E', '#C9D2E3', '#FFC928'];   // a ribbon for taking part, then bronze, silver, gold
// a cup for the podium (medal 1 to 3), or a ribbon for taking part (medal 0)
function drawTrophy(g, x, y, r, medal) {
  const col = MEDAL_COL[medal], ink = inkOf(col), lo = shade(col, -0.2);
  g.save(); g.translate(x, y); g.scale(r, r); g.lineJoin = g.lineCap = 'round'; g.lineWidth = 0.13; g.strokeStyle = ink;
  if (!medal) {
    g.fillStyle = lo; g.beginPath(); g.moveTo(-0.34, 0.1); g.lineTo(-0.5, 1); g.lineTo(-0.14, 0.76); g.lineTo(0, 1); g.lineTo(0.14, 0.76); g.lineTo(0.5, 1); g.lineTo(0.34, 0.1); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = col; g.beginPath(); for (let i = 0; i < 16; i++) { const a = (i / 16) * TAU, rr = i % 2 ? 0.6 : 0.74; g.lineTo(Math.cos(a) * rr, -0.22 + Math.sin(a) * rr); } g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(0, -0.22, 0.34, 0, TAU); g.fill(); g.stroke();
  } else {
    g.fillStyle = 'rgba(0,0,0,0)';
    for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * 0.5, -0.62); g.bezierCurveTo(s * 1.08, -0.66, s * 1.0, 0.02, s * 0.34, -0.02); g.lineWidth = 0.3; g.strokeStyle = ink; g.stroke(); g.lineWidth = 0.1; g.strokeStyle = col; g.stroke(); }
    g.lineWidth = 0.13; g.strokeStyle = ink;
    g.fillStyle = lo; g.beginPath(); g.roundRect(-0.46, 0.66, 0.92, 0.3, 0.08); g.fill(); g.stroke();
    g.fillStyle = col; g.beginPath(); g.moveTo(-0.14, 0.2); g.lineTo(0.14, 0.2); g.lineTo(0.2, 0.68); g.lineTo(-0.2, 0.68); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(-0.6, -0.9); g.lineTo(0.6, -0.9); g.bezierCurveTo(0.6, -0.1, 0.34, 0.26, 0, 0.26); g.bezierCurveTo(-0.34, 0.26, -0.6, -0.1, -0.6, -0.9); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = lo; g.beginPath(); g.moveTo(0.22, -0.84); g.lineTo(0.54, -0.84); g.bezierCurveTo(0.54, -0.2, 0.34, 0.12, 0.08, 0.2); g.bezierCurveTo(0.26, -0.1, 0.26, -0.5, 0.22, -0.84); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 0.1; g.beginPath(); g.moveTo(-0.38, -0.7); g.quadraticCurveTo(-0.38, -0.3, -0.22, -0.08); g.stroke();
  }
  g.restore();
}

// a little crown: sits on the child's best score
function drawCrown(g, x, y, r) {
  g.save(); g.translate(x, y); g.scale(r, r); g.lineJoin = 'round'; g.lineWidth = 0.16; g.strokeStyle = inkOf('#FFC928'); g.fillStyle = '#FFC928';
  g.beginPath(); g.moveTo(-0.9, 0.6); g.lineTo(-1, -0.5); g.lineTo(-0.45, 0); g.lineTo(0, -0.8); g.lineTo(0.45, 0); g.lineTo(1, -0.5); g.lineTo(0.9, 0.6); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = '#FF5A4E'; g.beginPath(); g.arc(0, 0.18, 0.2, 0, TAU); g.fill();
  g.restore();
}

// a string of little flags, hung from x0 to x1 and sagging in the middle
function drawBunting(g, x0, x1, y, sag, size, t = 0) {
  const n = Math.max(4, Math.round((x1 - x0) / (size * 1.5))), at = (u) => [lerp(x0, x1, u), y + Math.sin(u * Math.PI) * sag];

  for (let i = 0; i <= 24; i++) { const [x, yy] = at(i / 24); if (i) g.lineTo(x, yy); else g.moveTo(x, yy); }
  g.stroke();
  for (let i = 0; i < n; i++) {
    const [x, yy] = at((i + 0.5) / n), sw = Math.sin(t * 2.2 + i * 1.3) * size * 0.12;
    g.fillStyle = PALETTE[[0, 2, 5, 3, 8, 7][i % 6]]; g.strokeStyle = INK; g.lineWidth = Math.max(1.2, size * 0.07);

// ---------- the growing card: three abilities with five pips each, and the tickets ----------
// Pinned in the fair. Everywhere else it drops in for a moment when something grows, then leaves.
const GrowHud = (() => {
  let d = null, rep = null, t = 0, hold = 0, pinned = false, amt = 0, wig = 0, plus = -1;
  function show(dd, report) { if (!report) return; d = dd; rep = report; t = 0; hold = 5; if (report.tickets) Sound.sfx('sparkle', { gain: 0.5 }); }
  function pin(dd) { pinned = !!dd; if (dd) { if (d !== dd) rep = null; d = dd; } }
  function hide() { hold = 0; rep = null; }
  function step(dt) {
    const was = t; t += dt; hold -= dt; wig = Math.max(0, wig - dt * 2.5);
    amt = damp(amt, pinned || hold > 0 ? 1 : 0, 10, dt);
    if (rep) {                                              // a pip lighting makes a sound, a little higher each time
      rep.gain.forEach((n, q) => { const at = 0.7 + q * 0.3; if (n && was < at && t >= at) Sound.sing(rep.after[q] > rep.before[q] ? 4 + q : q, { gain: 0.6 }); });
      if (t > 5) rep = null;
    }
  }
  // top = the y the card sits at. Its width shrinks to leave the corner buttons clear.
  function draw(g, W, top = 12) {
    if (amt < 0.01 || !d) return;
    const G = Grow.of(d), u = Math.min(1, (W - 128) / 262), w = 262 * u, h = 52 * u, x = (W - w) / 2 + Math.sin(wig * 22) * wig * 7, y = top - (1 - amt) * (h + top + 12);
    g.save();
    g.fillStyle = 'rgba(43,45,66,0.16)'; g.beginPath(); g.roundRect(x, y + 4, w, h, h / 2); g.fill();
    g.fillStyle = 'rgba(255,253,248,0.96)'; g.beginPath(); g.roundRect(x, y, w, h, h / 2); g.fill();
    const lv = Grow.levels(d);
    for (let q = 0; q < 3; q++) {
      const bx = x + (16 + q * 56) * u, at = 0.7 + q * 0.3, gain = rep ? rep.gain[q] : 0, lit = rep && t < at ? rep.before[q] : lv[q];
      const grew = rep && rep.after[q] > rep.before[q] && t >= at, pop = grew ? clamp01(1 - (t - at) / 0.6) : 0, bump = gain && t >= at ? Math.max(0, 1 - (t - at) / 0.4) : 0;
      drawQual(g, q, bx + 21 * u, y + 17 * u, (11 + bump * 4) * u);
      drawPips(g, bx + 2.4 * u, y + 40 * u, lit, QUALS[q].col, 4.2 * u, 9.5 * u, pop);
      if (plus === q && lit < 5) { g.strokeStyle = QUALS[q].col; g.lineWidth = 1.6 * u; g.setLineDash([2.5 * u, 2.5 * u]); g.beginPath(); g.arc(bx + 2.4 * u + lit * 9.5 * u, y + 40 * u, (4.6 + Math.sin(t * 6) * 0.8) * u, 0, TAU); g.stroke(); g.setLineDash([]); }
      if (gain && t >= at && t < at + 1.1) {                 // a little "more" rising off the icon
        const k = (t - at) / 1.1;
        g.globalAlpha = 1 - k; g.fillStyle = QUALS[q].col;
        for (let i = 0; i < Math.min(4, gain); i++) { g.beginPath(); g.arc(bx + (34 + i * 7) * u, y + (16 - k * 12 - (i % 2) * 4) * u, 2.6 * u, 0, TAU); g.fill(); }
        g.globalAlpha = 1;
      }
    }
    // the snacks it had eaten, each dropping into the ability it fed
    if (rep) rep.meals.forEach((m, j) => {
      const k = clamp01((t - 0.15 - j * 0.22) / 0.55);
      if (k >= 1) return;
      const tx = x + (16 + m.q * 56 + 21) * u, ty = y + 17 * u, e = ease.inOut(k), sx = lerp(W / 2 + (j - 1) * 30, tx, e), sy = lerp(y + h + 70, ty, e) - Math.sin(k * Math.PI) * 26, r = 13 * u * (1 - e * 0.5);
      g.save(); g.translate(sx, sy); g.scale(r, r); Snacks[m.k](g, { t: 0, lw: 2.4 / r }); g.restore();
    });
    // tickets
    const tx = x + 200 * u, got = rep ? rep.tickets : 0, at = 1.7, n = rep && got ? Math.round(lerp(rep.had, rep.had + got, clamp01((t - at) / 0.5))) : G.tickets, bump = rep && got && t >= at ? Math.max(0, 1 - (t - at) / 0.5) : 0;
    g.strokeStyle = 'rgba(43,45,66,0.12)'; g.lineWidth = 2 * u; g.beginPath(); g.moveTo(x + 181 * u, y + 10 * u); g.lineTo(x + 181 * u, y + h - 10 * u); g.stroke();
    drawTicket(g, tx + 6 * u, y + h / 2, (12 + bump * 5) * u);
    g.fillStyle = INK; g.font = `800 ${Math.round(20 * u)}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(n), tx + 38 * u, y + h / 2 + 1.5 * u);
    if (rep && got && t >= at - 0.6 && t < at) {             // new tickets fly in
      const k = clamp01((t - (at - 0.6)) / 0.6);
      for (let i = 0; i < Math.min(5, got); i++) drawTicket(g, lerp(W / 2 + (i - 2) * 26, tx + 6 * u, ease.inOut(k)), lerp(y + h + 90, y + h / 2, ease.inOut(k)) - Math.sin(k * Math.PI) * (20 + i * 8), 10 * u, -0.2 + k * 3);
    }
    g.restore();
  }
  return { show, pin, hide, step, draw, shake: () => { wig = 1; }, boost: (q) => { plus = q; }, get busy() { return !!rep; } };
})();

// ---------- the growing moment: "as I am" beside "the new look", and the child picks ----------
const Moment = (() => {
  let root, box, btns = [], c = null, look = 0, done = null;
  function build() {
    root = el('div', 'overlay moment', App.ui);
    root.setAttribute('role', 'dialog'); root.setAttribute('aria-label', 'Grow');
    box = el('div', 'lookpick', root);
    ['Stay as I am', 'New look'].forEach((label, i) => {
      const b = el('button', 'thumb look' + (i ? ' new' : ''), box); b.type = 'button'; b.setAttribute('aria-label', label);
      b.addEventListener('click', () => { Sound.unlock(); choose(!!i); });
      btns.push(b);
    });
  }
  // a doodling drawn into a button, wearing one look (the look is put back afterwards)
  function portrait(b, cr, lk, size) {
    b.replaceChildren();
    const [, g] = miniCanvas(size, b), G = Grow.of(cr.d), was = G.look;
    G.look = lk;
    const k = new Critter(cr.d);
    k.alive = true; k.talk = lk ? 0.5 : 0; if (lk) { k.mood = 'happy'; k.moodT = 9; }
    k.pose(size / 2, 0, 50);
    const fit = 50 * Math.min((size * 0.58) / (k.bounds.maxX - k.bounds.minX), (size * 0.58) / (k.bounds.maxY - k.bounds.minY));
    k.pose(size / 2, 0, fit); k.pose(size / 2, size * 0.86 - k.bounds.maxY, fit);
    g.fillStyle = 'rgba(30,25,60,0.14)'; g.beginPath(); g.ellipse(size / 2, size * 0.87, fit * 0.9, fit * 0.14, 0, 0, TAU); g.fill();
    k.draw(g);
    G.look = was;
  }
  function open(critter, lk, then) {
    if (!root) build();
    c = critter; look = lk; done = then;
    const size = Math.round(clamp(Math.min(App.W * 0.4, App.H * 0.42), 120, 250));
    portrait(btns[0], c, Grow.of(c.d).look, size); portrait(btns[1], c, look, size);
    root.classList.add('on');
    Sound.sfx('magic'); Sound.sfx('grow', { gain: 0.5 });
  }
  function choose(wear) {
    Grow.settle(c.d, look, wear);
    root.classList.remove('on');
    c.refreshParts(); App.keep(c);
    Sound.sfx(wear ? 'rainbow' : 'tap'); if (wear) Sound.sfx('confetti', { gain: 0.6 });
    if (done) done(wear);
  }
  return { open, portrait, hold: false, get isOpen() { return !!root && root.classList.contains('on'); } };
})();
