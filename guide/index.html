<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Doodlings picture guide</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{--ink:#2B2D42;--pw:5.5in}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"SF Pro Rounded",ui-rounded,"Arial Rounded MT Bold","Nunito",system-ui,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{position:relative;width:var(--pw);height:calc(var(--pw)*85/55);font-size:calc(var(--pw)/55);background:#fff;overflow:hidden;padding:3.2em 3.5em 3em;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:1.2em;height:6.2em;flex:none;margin-bottom:1.5em}
header.sub{height:5em;margin:0;width:100%}
.badge{width:6em;height:6em;border-radius:50%;background:var(--c);border:.3em solid var(--ink);box-shadow:0 .36em 0 var(--ink);display:grid;place-items:center;color:#fff;flex:none}
.badge.dk{color:var(--ink)}
.badge svg{width:62%;height:62%;display:block}
.badge svg.hand{width:92%;height:92%}
.sub .badge{width:4.6em;height:4.6em}
.rule{flex:1;height:.8em;border-radius:1em;background:var(--c);opacity:.4}
.pno{width:2em;height:2em;border-radius:50%;border:.14em solid var(--ink);display:grid;place-items:center;font-size:1.9em;font-weight:800;flex:none}
.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:0}
.row{display:flex;gap:1.4em;justify-content:center;align-items:center;width:100%}
.col{display:flex;flex-direction:column;gap:1.4em}
.pic{position:relative;border:.28em solid var(--ink);border-radius:1.6em;overflow:hidden;background:#EEF3F6;flex:none}
.pic img{position:absolute;max-width:none;display:block;height:auto}
.pic .loop{z-index:1}
.n{position:absolute;left:.4em;top:.4em;width:1.5em;height:1.5em;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:2em;display:grid;place-items:center;z-index:3;border:.1em solid #fff}
.mark{position:absolute;left:.7em;top:.7em;z-index:3;display:flex;gap:.5em;align-items:center}
.n + .mark{left:4.6em}
.pic.mr .mark{left:auto;right:.7em}
.pic.nb .n{top:auto;bottom:.4em}
.check{position:absolute;right:.7em;bottom:.7em;width:3em;height:3em;border-radius:50%;border:.3em dashed var(--ink);background:rgba(255,255,255,.9);z-index:3}
.chip{width:5em;height:5em;border-radius:50%;background:#fff;border:.28em solid var(--ink);box-shadow:0 .3em 0 var(--ink);display:inline-grid;place-items:center;flex:none;color:var(--ink)}
.chip svg{width:58%;height:58%;display:block}
.chip.sm{width:3.6em;height:3.6em;border-width:.24em;box-shadow:0 .22em 0 var(--ink)}
.chip.gest{width:4.6em;height:4.6em;background:var(--c,#FFC928)}
.chip.gest svg{width:96%;height:96%}
.chip.snack{width:4.6em;height:4.6em}
.chip.snack img{position:static;width:78%;height:78%}
.chip.snack.lg{width:7em;height:7em}
.pips{display:flex;gap:.35em;background:#fff;border:.22em solid var(--ink);border-radius:2em;padding:.5em .7em}
.pips i{width:1em;height:1em;border-radius:50%;background:var(--ink);display:block}
.arrow{width:3.4em;height:2.4em;flex:none;display:block}
.arrow.r{width:2.2em;height:3.2em}
.op{width:2.6em;height:2.6em;flex:none}
.gap{width:1.2em}

/* cover and back */
.cover{padding:4em 3em 3em}
.cover .body{justify-content:flex-start}
.cover .stage{margin:auto 0}
.cover .covericons{margin-top:0}
.wordmark{width:92%;display:block;margin:2em auto 0}
.wordmark.small{width:36%;margin:0 auto;opacity:.8}
.stage{position:relative;width:100%;margin-top:3em}
.stage .sun{position:absolute;left:50%;top:46%;width:108%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,201,40,.34),rgba(255,201,40,.16) 62%,rgba(255,201,40,0))}
.crowd{position:relative;width:108%;display:block;margin:0 -4%}
.covericons{display:flex;gap:.55em;margin-top:auto;padding-top:2em}
.chip.col{background:var(--c);color:#fff;width:3.8em;height:3.8em}
.chip.col.dk{color:var(--ink)}
.back .body{justify-content:space-between}
.heart{width:11em;display:block;margin-top:9em}
.back .stage{margin-top:2em;margin-bottom:auto}
.together{margin-top:0}
.you{position:absolute;left:50%;bottom:2%;width:21%;transform:translateX(-50%)}
.youpen{position:absolute;left:50%;bottom:-3.4em;transform:translateX(-50%)}
.youpen .chip{width:4em;height:4em}

/* how it works */
.how .chip.gest{width:15em;height:15em;border-width:.34em;box-shadow:0 .5em 0 var(--ink);background:#fff}
.how .chip.gest svg{width:82%;height:82%}
.how .row{gap:1em}
.map{display:grid;grid-template-columns:repeat(3,auto);gap:2.3em 1.8em;margin:auto 0}
.cell{position:relative}
.cell .pic{border-color:var(--ink)}
.cell .tag{position:absolute;right:-.9em;bottom:-.9em;width:4.4em;height:4.4em;border-radius:50%;background:var(--c);border:.26em solid var(--ink);display:grid;place-items:center;color:#fff;z-index:4}
.cell .tag.dk{color:var(--ink)}
.cell .tag svg{width:60%;height:60%}
.cell .tag svg.hand{width:94%;height:94%}
.cell .n{left:-.45em;top:-.45em;border:.12em solid #fff;z-index:4}

/* small helpers */
.tools{display:flex;justify-content:space-between;align-items:center;width:100%;gap:1em}
.tools .row{width:auto;gap:.7em}
.tools .chip{width:4.4em;height:4.4em}
.tools .arrow.r{width:1.5em;height:2.4em}
.trio{display:flex}
.trio span:not(.mark){position:relative;flex:1;overflow:hidden;height:100%}
.trio span + span:not(.mark){border-left:.2em solid #fff}
.mix{display:flex;align-items:center;gap:1.1em}
.blank{width:1.75em;height:1.75em;border-radius:.4em;border:.08em dashed var(--ink);display:grid;place-items:center;font-size:4em;font-weight:800;color:rgba(43,45,66,.45)}
.two .row{align-items:flex-start}
.wearrow{display:flex;gap:.55em;justify-content:center}
.bigrow{display:flex;gap:1em;justify-content:center}
.chip.art{width:6.6em;height:6.6em;border:0;box-shadow:none;background:none}
.chip.art img{width:100%;height:100%;display:block}
.bigrow.sm .chip.art{width:5em;height:5em}
.crew{display:grid;grid-template-columns:repeat(4,1fr);gap:.6em 1em;width:100%;margin:auto 0}
.mate{position:relative}
.mate img{width:100%;display:block}
.mate .check{right:0;bottom:.2em;width:2.6em;height:2.6em}
.waygrid{display:grid;grid-template-columns:repeat(4,auto);gap:1em 1.4em}
.chip.snack.sm img{width:86%;height:86%}

:root{--pw:min(96vw,640px,calc((100svh - 150px)*55/85))}
html{background:#FBF3E4;scroll-behavior:smooth;scroll-padding-top:74px}
body{padding:0 0 40px;background:radial-gradient(90vw 60vh at 0 0,rgba(255,201,40,.2),transparent 70%),radial-gradient(80vw 60vh at 100% 10%,rgba(255,111,181,.13),transparent 70%),#FBF3E4;min-height:100vh}
nav{position:sticky;top:0;z-index:20;display:flex;gap:8px;justify-content:safe center;padding:10px 12px;overflow-x:auto;background:rgba(251,243,228,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{width:46px;height:46px;border-radius:50%;background:var(--c);border:3px solid #2B2D42;box-shadow:0 3px 0 #2B2D42;display:grid;place-items:center;color:#fff;flex:none;text-decoration:none;transition:transform .15s}
nav a.dk{color:#2B2D42}
nav a:active{transform:translateY(3px);box-shadow:none}
nav a svg{width:58%;height:58%}
nav a svg.hand{width:94%;height:94%}
main{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:10px}
.page{border-radius:calc(var(--pw)/26);box-shadow:0 10px 34px rgba(43,45,66,.16);background:#FFFDF8}
@media print{
  @page{size:5.5in 8.5in;margin:0}
  :root{--pw:5.5in}
  html,body{background:#fff}
  body{padding:0}
  nav,.reader-controls,.pic img.loop{display:none!important}
  main{display:block;padding:0}
  .page{border-radius:0;box-shadow:none;background:#fff;break-after:page}
}
.reader-controls{position:sticky;bottom:10px;z-index:22;margin:20px auto 0;width:max-content;max-width:96vw;display:flex;align-items:center;gap:12px;background:#fffdf8;border:2px solid #2b2d42;border-radius:40px;padding:8px 12px;box-shadow:0 5px 18px #2b2d4226}
.reader-controls button{width:44px;height:44px;border:0;border-radius:50%;background:#ffc928;color:#2b2d42;cursor:pointer;display:grid;place-items:center;font:700 24px system-ui}
.reader-controls button:disabled{opacity:.3;cursor:default}.reader-controls svg{width:24px;height:24px}
.reader-controls output{min-width:58px;text-align:center;font:700 16px system-ui}
.still-mode .loop{display:none}nav a[aria-current]{outline:3px solid white;outline-offset:-6px}button:focus-visible,a:focus-visible{outline:3px solid #3f6bf0;outline-offset:3px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media(max-height:500px){:root{--pw:min(92vw,480px)}nav{position:relative}}

function setMotion(){document.body.classList.toggle('still-mode',still);motion.setAttribute('aria-pressed',String(still));motion.setAttribute('aria-label',still?'Play moving pictures':'Show still pictures');motion.innerHTML=still?'&#9654;':'&#10074;&#10074;';document.querySelectorAll('img.loop').forEach(im=>{if(still)im.removeAttribute('src');else im.src=im.dataset.src});try{sessionStorage.setItem('doodlings.guide.still',still)}catch(_){} }
previous.onclick=()=>go(current-1);next.onclick=()=>go(current+1);motion.onclick=()=>{still=!still;setMotion()};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}if(e.key==='Escape')parent.postMessage('doodlings:close-guide','*')});
let pending=false;addEventListener('scroll',()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;if(!pages[0].getBoundingClientRect().height)return;let best=Infinity;pages.forEach((p,i)=>{const d=Math.abs(p.getBoundingClientRect().top-80);if(d<best){best=d;current=i}});update()})},{passive:true});
addEventListener('message',e=>{if(e.source===parent&&e.data==='doodlings:resume-guide')go(current)});
setMotion();update();if(!location.hash&&current)requestAnimationFrame(()=>go(current));
</script></body></html>
